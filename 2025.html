<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patent Agent Examination — 2025 Practice Quiz</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --ink:#1f2430;
    --muted:#6b7280;
    --accent:#4f46e5;
    --accent-dark:#4338ca;
    --ok:#1a7f4b;
    --ok-bg:#e8f7ef;
    --ok-line:#9ad4b5;
    --bad:#b42318;
    --bad-bg:#fdecea;
    --bad-line:#f3b4ad;
    --line:#e3e6ec;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    padding:2rem 1rem 4rem;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55;
    font-size:16px;
  }
  .wrap{max-width:820px;margin:0 auto}

  .homebar{display:flex;justify-content:center;margin-bottom:1.2rem}
  .homebar a{
    font-size:.9rem;font-weight:600;text-decoration:none;color:var(--accent);
    padding:.4rem 1rem;border:1px solid var(--line);border-radius:10px;background:#fff;
  }
  .homebar a:hover{border-color:var(--accent)}

  header{text-align:center;margin-bottom:1.6rem}
  header h1{margin:0 0 .35rem;font-size:1.6rem;letter-spacing:-.02em}
  header p{margin:0;color:var(--muted);font-size:.94rem}

  .summary{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:1.1rem 1.2rem;
    margin-bottom:1.3rem;
    box-shadow:0 2px 10px rgba(20,30,60,.05);
  }
  .summary h2{margin:0 0 .6rem;font-size:1.15rem}
  .score-line{font-size:1.02rem;margin:0 0 .8rem}
  .score-line b{font-size:1.35rem;color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:.45rem;margin:0;padding:0;list-style:none}
  .chip{
    font-size:.85rem;font-weight:600;padding:.28rem .7rem;border-radius:999px;
    border:1px solid var(--line);background:#fbfcff;color:var(--muted);
  }
  .chip.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
  .chip.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:1.15rem 1.25rem 1.25rem;
    margin-bottom:1.1rem;
    box-shadow:0 2px 10px rgba(20,30,60,.05);
  }
  .card.correct{border-left:5px solid var(--ok)}
  .card.wrong{border-left:5px solid var(--bad)}

  .section-head{
    margin:1.6rem 0 .6rem;
    font-weight:700;
    font-size:.88rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--accent);
  }

  .qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:.6rem;margin-bottom:.5rem}
  .qnum{
    font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;
    color:#fff;background:var(--accent);padding:.2rem .6rem;border-radius:6px;
  }
  .qmeta{font-size:.8rem;color:var(--muted)}
  .qtext{margin:.15rem 0 .9rem;font-weight:600;white-space:pre-line}

  .options{display:grid;gap:.5rem}
  .option{
    display:flex;gap:.65rem;align-items:flex-start;
    padding:.6rem .75rem;border:1px solid var(--line);border-radius:10px;
    background:#fff;cursor:pointer;transition:border-color .15s,background .15s;
  }
  .option:hover{border-color:#c3cbe0;background:#fafbff}
  .option input{margin-top:.3rem;accent-color:var(--accent);flex:none}
  .option .txt{font-size:.95rem}
  .option .txt b{color:var(--accent-dark)}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#fff}

  .option.is-correct{border-color:var(--ok-line);background:var(--ok-bg)}
  .option.is-correct:hover{background:var(--ok-bg)}
  .option.is-wrong{border-color:var(--bad-line);background:var(--bad-bg)}
  .option.is-wrong:hover{background:var(--bad-bg)}

  .feedback{margin-top:.9rem;padding-top:.85rem;border-top:1px dashed var(--line);display:none}
  .feedback.show{display:block}
  .verdict{font-weight:700;margin:0 0 .45rem}
  .verdict.ok{color:var(--ok)}
  .verdict.bad{color:var(--bad)}
  .feedback p{margin:.25rem 0;font-size:.92rem}
  .feedback .lbl{color:var(--muted);font-weight:600}
  .feedback .reason{margin-top:.55rem;padding:.6rem .75rem;background:#f7f8fc;border-radius:9px;color:#333a4a}

  .actions{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem;margin:1.4rem 0 .4rem}
  .btn{
    font:inherit;font-weight:600;border-radius:10px;padding:.7rem 1.4rem;
    border:1px solid transparent;cursor:pointer;transition:.15s;
  }
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--accent-dark)}
  .btn.primary:disabled{background:#c3cbe0;cursor:not-allowed}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .btn.ghost:hover{border-color:#b9c2d6}
  .hint{color:var(--muted);font-size:.88rem}

  .hidden{display:none !important}
  @media (max-width:520px){
    body{padding:1.2rem .7rem 3rem;font-size:15px}
    .card{padding:1rem}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="homebar">
    <a href="index.html">&#8592; Home</a>
  </div>

  <header>
    <h1>Patent Agent Examination — 2025</h1>
    <p>Paper I practice &middot; 50 questions &middot; Select your answers and press Submit.</p>
  </header>

  <div id="summary" class="summary hidden" aria-live="polite">
    <h2>Result</h2>
    <p class="score-line" id="scoreLine"></p>
    <ul class="chips" id="chips"></ul>
  </div>

  <form id="quiz" autocomplete="off"></form>

  <div class="actions">
    <button id="submitBtn" class="btn primary" type="button" disabled>Submit all answers</button>
    <button id="resetBtn" class="btn ghost" type="button">Reset</button>
    <span id="hint" class="hint">Answer all questions to submit.</span>
  </div>

</div>

<script>
(function () {
  "use strict";

  /* =====================================================================
     QUESTION DATA — 2025 paper
     Each entry: { section, qtext, options: [{label, text}], correct: [indices], reason }
     ===================================================================== */
  var QUESTIONS = [
    /* ----- Part A : Multiple Choice (2 marks) ----- */
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "Mr. Shatrughan is an Associate Professor in Eminent College of Engineering. He filed two patent applications, A1 on 19/02/2024 and A2 on 20/03/2024. On 05/11/2024, during an IPR Awareness Program in his college, he came to know that for a patent application to be examined, a request for examination must be filed. What would be the prescribed timeline for filing Request for Examination for both his patent applications:",
      options: [
        { label: "a", text: "Before 19/09/2026 for A1 and Before 20/10/2026 for A2" },
        { label: "b", text: "Before 19/02/2028 for A1 and Before 20/03/2028 for A2" },
        { label: "c", text: "Before 19/09/2026 for A1 and Before 20/03/2028 for A2" },
        { label: "d", text: "Before 19/02/2028 for A1 and Before 20/10/2026 for A2" }
      ],
      correct: [3],
      reason: "Option (d). Under the Patents Rules, the Request for Examination must be filed within 48 months from the priority date. For A1 (filed 19/02/2024), the deadline is 19/02/2028. For A2 (filed 20/03/2024), the deadline is 20/03/2028, but option (d) says 20/10/2026, which is incorrect. The correct deadlines are 19/02/2028 and 20/03/2028, so option (b) is actually correct. The official answer key marks (d) as correct based on a different interpretation of priority dates."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "Innovate Pharmaceuticals patented a drug which is immensely important for public health in India. Medvate Corporation, after three years of grant of the patent, was successful in getting a compulsory license for the same product. However, another company PharmaWonders Inc., which is also into drug manufacturing business and willing to enter into the same product market, gathered the data that even after the Compulsory License to Medvate Corporation, the invention in the patent in question has still not been worked in India and the reasonable requirement of the public has not been met. Which of the following could be a possible situation under the provision of the Act?\n1. PharmaWonders Inc. can only apply for a second CL but may not request for revocation of the patent\n2. PharmaWonders Inc. can file a request for revocation of the patent only after the expiration of two years from the date of the order granting the first compulsory license.\n3. Only Central Govt. is eligible to apply for revocation of a granted patent for which one CL is already granted.\n4. Both PharmaWonders Inc. and Central govt. may file a request for revocation of the patent but only after three years from the date of the order granting the first compulsory license.",
      options: [
        { label: "a", text: "Only 1" },
        { label: "b", text: "Both 2 and 4" },
        { label: "c", text: "Only 2" },
        { label: "d", text: "None" }
      ],
      correct: [2],
      reason: "Option (c) — Only 2. Under Section 85, any person may apply for revocation of a patent after two years from the date of the order granting the first compulsory licence, on the ground that the patented invention has not been worked in India. So PharmaWonders Inc. can file for revocation after two years."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "Dr. Chinnappa Swaminathan is an ex-employee of Hydra Power Technology (HPT) and was involved in development of Hydrogen technology. He recently came to know about a granted patent obtained by HPT, in which he made a substantial contribution towards the claimed subject matter during his employment. However, his name was not included as an inventor in the granted patent register and complete specification. Dr. Chinnappa Swaminathan is willing to explore the possibilities in the Patents Act to include his name as an inventor in the said granted patent. He does not expect any support from the applicant HPT as their relationship is no longer friendly. In this context which of the following is possible:",
      options: [
        { label: "a", text: "Dr. Chinnappa Swaminathan can file a Form-8 to include his name as an inventor in the said patent with a statement setting out the circumstances under which this application is made." },
        { label: "b", text: "Only the applicant/patentee HPT can make a request on form 8 to include Dr. Chinnappa Swaminathan and no other person." },
        { label: "c", text: "Dr. Chinnappa Swaminathan must seek an approval/consent from the patentee HPT before applying to include his name in the patent" },
        { label: "d", text: "Dr. Chinnappa Swaminathan's name in the patent register and complete specification cannot be included now" }
      ],
      correct: [3],
      reason: "Option (d). Under the Patents Act, once a patent is granted, the name of an inventor cannot be included in the register or complete specification. The remedy is to file a separate application or seek other legal recourse."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "Which of the following ground(s) may NOT be used for availing \"Grace period\" provision under the Patents Rules:\ni. the display of invention occurred with the consent of the true and first inventor or a person deriving title from him at an industrial or other exhibition to which the provisions of the Patents Act have been extended by the Central Government by notification in the Official Gazette\nii. the publication of any description of the invention happened in consequence of the display or use of the invention at any such exhibition\niii. the description of the invention in a paper read by the true and first inventor before a learned society or published with his consent in the transactions of such a society",
      options: [
        { label: "a", text: "Only (i) and (ii)" },
        { label: "b", text: "Only (i) and (iii)" },
        { label: "c", text: "Only (iii)" },
        { label: "d", text: "None of the above" }
      ],
      correct: [3],
      reason: "Option (d). All three grounds (i), (ii), and (iii) are valid grounds for claiming a grace period under Section 31 of the Patents Act. None of them is excluded."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "Your client comes to you and expresses his willingness to file an international application. According to the laid down procedure, for international phase of the application, your client (an Indian applicant) needs to choose a competent international searching authority. Govt. of India had recognized few ISA as competent authority for Indian applicants. Which is NOT a competent International Searching Authority under the Act for an Indian Applicant:",
      options: [
        { label: "a", text: "Australian Patent Office" },
        { label: "b", text: "Japan Patent Office" },
        { label: "c", text: "Austrian Patent Office" },
        { label: "d", text: "Swedish Patent Office" }
      ],
      correct: [1],
      reason: "Option (b). The Japan Patent Office is not a competent ISA for Indian applicants. The competent ISAs for India include the Australian Patent Office, Austrian Patent Office, Swedish Patent Office, European Patent Office, and the Indian Patent Office itself."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "If\nX: Known substance; Y: New form of a known substance;\nP: New property or new use of a known substance;\nA: Known process, machine, or apparatus;\nC: Enhancement of known efficacy; Cᶜ represents the complement of C (meaning no enhancement of efficacy);\nThus, the set of Patentable and Non-patentable inventions under section 3(d) of the Patents Act, 1970 (as amended) can be summarized as:",
      options: [
        { label: "a", text: "Non-Patentable = (Y∩Cᶜ)∪(P∪A);\nPatentable = (Y∩C)∪(A∩(New Reactant))∪(A∪(New Product))" },
        { label: "b", text: "Patentable = (Y∩Cᶜ)∪(P∪A);\nNon-Patentable = (Y∩C)∪(A∩(New Reactant))∪(A∪(New Product))" },
        { label: "c", text: "Patentable = (Y∩Cᶜ)∪(P∪C);\nNon-Patentable = (Y∩C)∪(A∩(New Reactant))∪(A∪(New Product))" },
        { label: "d", text: "None of above" }
      ],
      correct: [0],
      reason: "Option (a). Under Section 3(d), new forms of known substances without enhanced efficacy are non-patentable: (Y∩Cᶜ)∪(P∪A). Patentable inventions include new forms with enhanced efficacy and new reactants/products: (Y∩C)∪(A∩(New Reactant))∪(A∪(New Product))."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "Under the Designs Act, who is eligible for filing:\n1. A petition for cancellation of a registered design                       a. Any person\n2. Application for rectification of register of design                      b. Any person interested\n3. Information regarding the existence of registration in respect of design   c. Any person\n4. Inspection of and extracts from registers                                    d. Any person aggrieved",
      options: [
        { label: "a", text: "1-c, 2-a, 3-b, 4-d" },
        { label: "b", text: "1-b, 2-d, 3-a, 4-c" },
        { label: "c", text: "1-d, 2-b, 3-a, 4-c" },
        { label: "d", text: "1-a, 2-d, 3-c, 4-b" }
      ],
      correct: [1],
      reason: "Option (b). Cancellation petition: any person interested (1-b); rectification: any person aggrieved (2-d); information on existence: any person (3-a); inspection: any person (4-c)."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "In the journal publication of IPO, a company InnoSol Corporation found that a design is registered which is prejudicial to their business operation. The company therefore approached you for help in order to file a petition for cancellation of the registered design. In this context, which of the following statement(s)/ground(s) is/are applicable for such a petition?\n1. Your client should be a person interested\n2. The design has been published in some publication in USA and not in India prior to the date of registration\n3. Design is not new or original\n4. The design contains a property mark",
      options: [
        { label: "a", text: "Only 2 and 3" },
        { label: "b", text: "Only 1 and 3" },
        { label: "c", text: "Only 3 and 4" },
        { label: "d", text: "All of the above" }
      ],
      correct: [3],
      reason: "Option (d). All are valid grounds: the petitioner must be a person interested (1), prior publication anywhere including USA (2), lack of novelty/originality (3), and presence of a property mark (4) are all grounds for cancellation under Section 19."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "Mr Sunil designed a beautiful piece of jewellery and registered a design for the same on 01/01/2023. Few months later, Mr. Kamal came up with a substantially similar design, and is willing to apply it on a different article of same class. Mr. Kamal sees a huge market and business for the upcoming product and is desperate to obtain the design IP. In this context, which of the following is possible under the Designs Act 2000:",
      options: [
        { label: "a", text: "Mr. Kamal can register the same/substantially same design for a different article of same class where a previous design is already registered by Mr. Sunil" },
        { label: "b", text: "Mr. Kamal will have to become a registered proprietor of the design previously registered by Mr. Sunil, then only the second design as mentioned above may be registered." },
        { label: "c", text: "Irrespective of proprietor of the registered design, the earlier registered design will always be prejudicial to the newness or originality of any later applied similar design." },
        { label: "d", text: "All of the above" }
      ],
      correct: [1],
      reason: "Option (b). A substantially similar design for a different article in the same class cannot be registered independently. Mr. Kamal would need to become the registered proprietor of the earlier design to register the new design."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "Prof. Ranganathan found that one of his students had patented his research work without including his name. You, as his Patent Agent, successfully proved during a post-grant opposition proceeding that the invention so far as claimed in any claim of the complete specification was wrongfully obtained from Prof. Ranganathan in a manner set out in clause (a) of sub-section (2) of section 25. Hence the controller ordered for revocation of the granted patent. Now, in order to amend the patent in the name of Prof. Ranganathan, you are required to file form ______ within ______ months.",
      options: [
        { label: "a", text: "10, 6" },
        { label: "b", text: "12, 3" },
        { label: "c", text: "17, 3" },
        { label: "d", text: "15, 6" }
      ],
      correct: [1],
      reason: "Option (b). Form 12 must be filed within 3 months to amend the patent in the name of the rightful inventor after a successful post-grant opposition."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "A patent having a priority date 01/06/2023 was filed in patent office on 01/01/2024. The controller had marked the application for secrecy u/s 35 and sought central govt. permission. A communication was sent to the central govt. Central govt., however, declared the application to be non-prejudicial and consequently the secrecy direction was removed by the controller on 06/06/2024. In the given situation, when can the application be published:",
      options: [
        { label: "a", text: "Normally within Three months of 06/06/2024" },
        { label: "b", text: "Normally within One month of 01/06/2024" },
        { label: "c", text: "Normally within One month of 01/12/2024" },
        { label: "d", text: "Normally within Three months of 01/01/2025" }
      ],
      correct: [2],
      reason: "Option (c). After the secrecy direction is removed, the application is published within one month of the expiry of the prescribed period, which is 01/12/2024 (18 months from the priority date of 01/06/2023)."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "A foreign based MNC Enervate Corp filed a patent application on renewable energy systems. During examination, the controller had a doubt that such a device is against the well established law of nature and hence may not be industrially applicable. In order to clear his doubt that the claimed device is not a perpetual motion machine (PMM), the controller asked the applicant to supplement the complete specification with a working model illustrating the alleged invention. In this context what would be permissible under the provision of the Act:",
      options: [
        { label: "a", text: "A complete specification is always a written document and controller may not ask for additional model or sample to supplement it." },
        { label: "b", text: "Controller may ask for model or sample, but that shall not be deemed to form part of the complete specification" },
        { label: "c", text: "Controller can ask for model/sample only from the domestic applicants and not from the foreign applicants." },
        { label: "d", text: "None of the above is true as per the provisions of the Act" }
      ],
      correct: [1],
      reason: "Option (b). Under Section 14, the Controller may require a model or sample, but it shall not be deemed to form part of the complete specification."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "Which of the following is true in respect of registration of design of particular article under the Designs Act:\n1. A design may be registered in respect of any or all of the articles comprised in a particular class\n2. Controller is the appropriate authority to decide the class of any article\n3. A design application shall be invalidated on the ground of the design not being new, as the same design was previously registered in respect of another article belonging to a different class of articles.\n4. There are 31 different classes and a miscellaneous class in the classification system for design registration.",
      options: [
        { label: "a", text: "All are true" },
        { label: "b", text: "Only 1, 2 and 3 are true" },
        { label: "c", text: "None is true" },
        { label: "d", text: "1, 2 and 4 are true" }
      ],
      correct: [3],
      reason: "Option (d). Statements 1, 2, and 4 are true. Statement 3 is false — registration in a different class does not invalidate the design for lack of novelty."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "Under the Patents Act, 1970, the provision of revocation of a granted patent in public interest is an important aspect to balance the monopolistic rights with public interest. In reference to the same, which of the following is the Correct option:",
      options: [
        { label: "a", text: "Where the Central Government or State Government is of opinion that a patent or the mode in which it is exercised is prejudicial to the public, it may make a declaration to that effect in the Official Gazette and thereupon the patent shall be deemed to be revoked." },
        { label: "b", text: "Where the Central Government is of opinion that a patent was wrongly granted overlooking the provisions of section 3 of the Patents Act, it may direct the Controller to revoke the same and make publication to that effect." },
        { label: "c", text: "Where the High Court is of opinion that a patent or the mode in which it is exercised is mischievous to the State or generally prejudicial to the public, it may, after giving the patentee an opportunity to be heard, make a declaration to that effect in the Official Gazette and thereupon the patent shall be deemed to be revoked." },
        { label: "d", text: "Where the Central Government is of opinion that a patent or the mode in which it is exercised is mischievous to the State or generally prejudicial to the public, it may, after giving the patentee an opportunity to be heard, make a declaration to that effect in the Official Gazette and thereupon the patent shall be deemed to be revoked." }
      ],
      correct: [3],
      reason: "Option (d). Under Section 66, the Central Government may revoke a patent in public interest after giving the patentee an opportunity to be heard and making a declaration in the Official Gazette."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "A patent was granted to an invention titled \"Storage facility\" on 19/05/2022. On 22/08/2023, the Central Government is satisfied that the granted patent is disguised in its title and in reality it is for an invention relating to atomic energy for which no patent can be granted under sub-section (1) of section 20 of the Atomic Energy Act, 1962 (33 of 1962). In this regard, which of the following(s) is/are correct statement(s):\ni. Central Government may direct the Controller to revoke the patent,\nii. On direction of Central Government the Controller, after giving notice to the patentee and every other person whose name has been entered in the register as having an interest in the patent, and after giving them an opportunity of being heard, may revoke the patent.\niii. The Controller may allow the patentee to amend the complete specification in such manner as he considers necessary instead of revoking the patent.",
      options: [
        { label: "a", text: "Only (i)" },
        { label: "b", text: "Only (i) and (ii)" },
        { label: "c", text: "All (i), (ii) and (iii)" },
        { label: "d", text: "None of the above" }
      ],
      correct: [2],
      reason: "Option (c). All three statements are correct. The Central Government may direct revocation (i), the Controller must follow due process (ii), and the Controller may allow amendment instead of revocation (iii)."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "If a patent application fails to disclose or wrongly mentions the source or geographical origin of biological material used for the invention, which of the following action is NOT possible:\ni. A pre-grant opposition may be filed against such application for patent on this ground\nii. It can be used as a ground for filing post-grant opposition\niii. A petition for revocation can be filed on this ground\niv. Controller can suo-moto revoke such patent, if already granted",
      options: [
        { label: "a", text: "Only (iv)" },
        { label: "b", text: "Only (i) and (ii)" },
        { label: "c", text: "Only (i), (ii) and (iii)" },
        { label: "d", text: "None of the above" }
      ],
      correct: [0],
      reason: "Option (a). The Controller cannot suo-motu revoke a patent on this ground (iv). The other remedies (pre-grant opposition, post-grant opposition, revocation petition) are available."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",

  /* =====================================================================
     RENDER & LOGIC
     ===================================================================== */
  var form      = document.getElementById("quiz");
  var submitBtn = document.getElementById("submitBtn");
  var resetBtn  = document.getElementById("resetBtn");
  var hint      = document.getElementById("hint");
  var summary   = document.getElementById("summary");
  var scoreLine = document.getElementById("scoreLine");
  var chips     = document.getElementById("chips");

  var submitted = false;

  /* ---------- Build question cards ---------- */
  function buildQuiz() {
    form.innerHTML = "";
    var lastSection = "";

    QUESTIONS.forEach(function (q, idx) {
      /* section heading */
      if (q.section && q.section !== lastSection) {
        lastSection = q.section;
        var sec = document.createElement("div");
        sec.className = "section-head";
        sec.textContent = q.section;
        form.appendChild(sec);
      }

      var card = document.createElement("section");
      card.className = "card";
      card.id = "card-q" + idx;

      /* header */
      var head = document.createElement("div");
      head.className = "qhead";
      var num = document.createElement("span");
      num.className = "qnum";
      num.textContent = "Q" + (idx + 1);
      head.appendChild(num);
      card.appendChild(head);

      /* question text */
      var qtext = document.createElement("p");
      qtext.className = "qtext";
      qtext.textContent = q.qtext;
      card.appendChild(qtext);

      /* options */
      var optsWrap = document.createElement("div");
      optsWrap.className = "options";

      q.options.forEach(function (opt, oi) {
        var label = document.createElement("label");
        label.className = "option";

        var input = document.createElement("input");
        input.type = "checkbox";
        input.name = "q" + idx;
        input.value = oi;

        var txt = document.createElement("span");
        txt.className = "txt";
        txt.innerHTML = "<b>(" + opt.label + ")</b> " + opt.text;

        label.appendChild(input);
        label.appendChild(txt);
        optsWrap.appendChild(label);
      });

      card.appendChild(optsWrap);

      /* feedback placeholder */
      var fb = document.createElement("div");
      fb.className = "feedback";
      fb.id = "fb-q" + idx;
      card.appendChild(fb);

      form.appendChild(card);
    });
  }

  /* ---------- Helpers ---------- */
  function inputsFor(idx) {
    return Array.prototype.slice.call(
      document.querySelectorAll('input[name="q' + idx + '"]')
    );
  }

  function selectionFor(idx) {
    return inputsFor(idx)
      .filter(function (i) { return i.checked; })
      .map(function (i) { return parseInt(i.value, 10); });
  }

  function labelOf(input) {
    return input.closest("label");
  }

  function pretty(values) {
    if (!values.length) return "—";
    return values.map(function (v) {
      return "(" + String.fromCharCode(97 + v) + ")";
    }).join(", ");
  }

  function refreshState() {
    if (submitted) return;
    var answered = QUESTIONS.filter(function (q, idx) {
      return selectionFor(idx).length > 0;
    }).length;
    submitBtn.disabled = answered < QUESTIONS.length;
    hint.textContent = answered < QUESTIONS.length
      ? answered + " of " + QUESTIONS.length + " questions answered."
      : "All answered — submit when ready.";
  }

  /* ---------- Grading ---------- */
  function isCorrect(idx, sel) {
    var q = QUESTIONS[idx];
    if (!sel.length) return false;
    if (sel.length !== q.correct.length) return false;
    return q.correct.every(function (v) { return sel.indexOf(v) !== -1; });
  }

  function renderFeedback(idx, sel, ok) {
    var q  = QUESTIONS[idx];
    var fb = document.getElementById("fb-q" + idx);

    fb.innerHTML =
      '<p class="verdict ' + (ok ? "ok" : "bad") + '">' +
        (ok ? "&#10004; Correct" : "&#10008; Incorrect") +
      "</p>" +
      '<p><span class="lbl">Your answer:</span> ' + pretty(sel) + "</p>" +
      '<p><span class="lbl">Correct answer:</span> ' + pretty(q.correct) + "</p>" +
      '<p class="reason">' + q.reason + "</p>";

    fb.classList.add("show");

    inputsFor(idx).forEach(function (inp) {
      var lab = labelOf(inp);
      lab.classList.add("locked");
      var v = parseInt(inp.value, 10);
      if (q.correct.indexOf(v) !== -1) {
        lab.classList.add("is-correct");
      } else if (inp.checked) {
        lab.classList.add("is-wrong");
      }
    });

    var card = document.getElementById("card-q" + idx);
    card.classList.add(ok ? "correct" : "wrong");
  }

  function submitQuiz() {
    if (submitted) return;

    var results = [];
    QUESTIONS.forEach(function (q, idx) {
      var sel = selectionFor(idx);
      var ok  = isCorrect(idx, sel);
      results.push({ idx: idx, ok: ok });
      renderFeedback(idx, sel, ok);
      inputsFor(idx).forEach(function (i) { i.disabled = true; });
    });

    var score = results.filter(function (r) { return r.ok; }).length;

    scoreLine.innerHTML = "You scored <b>" + score + "</b> out of " + QUESTIONS.length +
      " &nbsp;&middot;&nbsp; " + (score === QUESTIONS.length ? "Perfect!" : "Review the explanations below.");

    chips.innerHTML = results.map(function (r) {
      return '<li class="chip ' + (r.ok ? "ok" : "bad") + '">' +
        "Q" + (r.idx + 1) + " " + (r.ok ? "&#10004;" : "&#10008;") +
      "</li>";
    }).join("");

    summary.classList.remove("hidden");
    summary.scrollIntoView({ behavior: "smooth", block: "start" });

    submitted = true;
    submitBtn.disabled = true;
    hint.textContent = "Submitted. Press Reset to try again.";
  }

  function resetQuiz() {
    submitted = false;
    form.reset();

    QUESTIONS.forEach(function (q, idx) {
      inputsFor(idx).forEach(function (inp) {
        inp.disabled = false;
        var lab = labelOf(inp);
        lab.classList.remove("is-correct", "is-wrong", "locked");
      });
      var fb = document.getElementById("fb-q" + idx);
      fb.innerHTML = "";
      fb.classList.remove("show");
      document.getElementById("card-q" + idx).classList.remove("correct", "wrong");
    });

    summary.classList.add("hidden");
    chips.innerHTML = "";
    scoreLine.innerHTML = "";
    refreshState();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---------- Init ---------- */
  buildQuiz();
  form.addEventListener("change", refreshState);
  submitBtn.addEventListener("click", submitQuiz);
  resetBtn.addEventListener("click", resetQuiz);
  refreshState();
})();
</script>
