<head>

<title>Patent Agent Examination — 2025 Practice</title>
<style>
  :root{
    --bg:#f6f7fb; --surface:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e5e8f0;
    --brand:#4f46e5; --brand2:#7c3aed; --brand-soft:#eef2ff;
    --ok:#16a34a; --ok-bg:#ecfdf3; --ok-line:#86efac;
    --bad:#dc2626; --bad-bg:#fef2f2; --bad-line:#fca5a5;
    --sel-bg:#f3e8ff; --sel-line:#a855f7;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -12px rgba(15,23,42,.12);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1020; --surface:#131a2e; --text:#e6e9f5; --muted:#94a0bd; --line:#232c47;
      --brand:#818cf8; --brand2:#a78bfa; --brand-soft:#1b2347;
      --ok:#4ade80; --ok-bg:#0f2a1e; --ok-line:#1f6f45;
      --bad:#f87171; --bad-bg:#2d1519; --bad-line:#7f2a33;
      --sel-bg:#2a1b47; --sel-line:#8b5cf6;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
  header.top{position:relative;overflow:hidden;color:#fff;padding:44px 20px 70px;
    background:radial-gradient(900px 400px at 85% -20%,rgba(167,139,250,.55),transparent 60%),radial-gradient(700px 380px at 0% 120%,rgba(56,189,248,.35),transparent 60%),linear-gradient(135deg,#1e1b4b,#312e81 55%,#4338ca)}
  header.top .inner{max-width:900px;margin:0 auto;position:relative}
  .eyebrow{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:5px 12px;border-radius:999px;margin-bottom:14px;backdrop-filter:blur(6px)}
  header.top h1{margin:0 0 8px;font-size:clamp(26px,4.6vw,38px);line-height:1.15;letter-spacing:-.02em;font-weight:800}
  header.top p{margin:0 0 24px;font-size:15px;opacity:.82;max-width:620px}
  .tabs{display:inline-flex;gap:4px;padding:5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:14px;backdrop-filter:blur(8px);flex-wrap:wrap}
  .tab{font:inherit;font-size:14.5px;font-weight:700;padding:9px 22px;border-radius:10px;border:0;background:transparent;color:rgba(255,255,255,.85);cursor:pointer;transition:all .18s}
  a.tab{text-decoration:none;display:inline-block;line-height:1.4}
  .tab:hover{background:rgba(255,255,255,.14);color:#fff}
  .tab.active{background:#fff;color:#3730a3;box-shadow:0 4px 14px -4px rgba(0,0,0,.35)}
  .tab .ext{font-size:11px;opacity:.65;margin-left:5px;font-weight:800}
  .tab.active .ext{opacity:.5}
  .scorebar{position:sticky;top:10px;z-index:30;max-width:900px;margin:-34px auto 0;padding:0 16px}
  .scorebar .inner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px 14px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .pill{font-size:13px;font-weight:600;padding:6px 12px;border-radius:10px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
  .pill.green{background:var(--ok-bg);color:var(--ok)}
  .pill.red{background:var(--bad-bg);color:var(--bad)}
  .pill.gold{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
  .spacer{flex:1}
  button.reset{font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s}
  button.reset:hover{color:var(--text);border-color:var(--brand)}
  .progress{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--line)}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .35s ease}
  main{max-width:900px;margin:0 auto;padding:26px 16px 70px}
  h2.sechead{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--brand);margin:38px 0 14px}
  h2.sechead:first-child{margin-top:10px}
  h2.sechead::after{content:"";flex:1;height:1px;background:var(--line)}
  .qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;margin-bottom:16px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s}
  .qcard:hover{transform:translateY(-1px)}
  .qtitle{font-size:15.5px;font-weight:500;margin-bottom:14px;white-space:pre-line}
  .qnum{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 8px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:9px;font-size:13px;margin-right:10px;font-weight:800;vertical-align:1px}
  .multi{display:inline-block;font-size:12px;color:var(--brand2);background:var(--sel-bg);font-weight:700;margin:-4px 0 10px;padding:3px 10px;border-radius:999px}
  .opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:inherit;font-size:14.5px;line-height:1.5;cursor:pointer;transition:all .14s}
  .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft);transform:translateX(2px)}
  .opt:disabled{cursor:default}
  .opt b{flex:none;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:800;transition:all .14s}
  .opt.sel{background:var(--sel-bg);border-color:var(--sel-line)}
  .opt.sel b{background:var(--sel-line);color:#fff}
  .opt.correct{background:var(--ok-bg);border-color:var(--ok-line);color:var(--text);font-weight:600}
  .opt.correct b{background:var(--ok);color:#fff}
  .opt.correct::after{content:"✓";margin-left:auto;color:var(--ok);font-weight:800}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad-line);color:var(--text);font-weight:600}
  .opt.wrong b{background:var(--bad);color:#fff}
  .opt.wrong::after{content:"✕";margin-left:auto;color:var(--bad);font-weight:800}
  button.check{margin-top:8px;font:inherit;font-size:14px;font-weight:700;padding:10px 22px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;cursor:pointer;box-shadow:0 8px 18px -8px var(--brand);transition:transform .15s,opacity .15s}
  button.check:hover:not(:disabled){transform:translateY(-1px)}
  button.check:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:default}
  .free{margin-top:10px;font-size:12.5px;color:#92400e;background:#fef3c7;border-radius:10px;padding:8px 12px}
  @media (prefers-color-scheme: dark){.free{background:#3a2a0a;color:#fcd34d}}
  footer{max-width:900px;margin:0 auto;padding:0 16px 50px;font-size:12.5px;color:var(--muted);text-align:center}
  @media (max-width:560px){
    header.top{padding:32px 16px 62px}
    .tab{padding:8px 14px}
    .qcard{padding:18px 16px 14px;border-radius:16px}
    .scorebar{top:6px}
  }
</style>

<script>
/* ---------- helpers ---------- */
const S = (title, m) => ({ s: title, m });
const Q = (t, o, a, free) => ({ t, o, a, free: !!free });

const AR = ["When both (A) and (R) are true, and (R) is a correct explanation of (A)","When both (A) and (R) are true, but (R) is NOT a correct explanation of (A)","When (A) is true but (R) is false","When (A) is false but (R) is true"];
const TF = ["When Statement 1 is True, and Statement 2 is False","When Statement 1 is False, and Statement 2 is True","When Both Statements 1 and 2 are True","When Both Statements 1 and 2 are False"];

/* =====================================================================
   2025 — SET A
   ===================================================================== */
const Y2025 = [
S("Part A — Multiple Choice (2 marks each)", 2),
Q(`Mr. Shatrughan is an Associate Professor in Eminent College of Engineering. He filed two patent applications, A1 on 19/02/2024 and A2 on 20/03/2024. On 05/11/2024, during an IPR Awareness Program in his college, he came to know that for a patent application to be examined, a request for examination must be filed. What would be the prescribed timeline for filing Request for Examination for both his patent applications:`,
 ["Before 19/09/2026 for A1 and Before 20/10/2026 for A2","Before 19/02/2028 for A1 and Before 20/03/2028 for A2","Before 19/09/2026 for A1 and Before 20/03/2028 for A2","Before 19/02/2028 for A1 and Before 20/10/2026 for A2"],"d"),
Q(`Innovate Pharmaceuticals patented a drug which is immensely important for public health in India. Medvate Corporation, after three years of grant of the patent, was successful in getting a compulsory license for the same product. However, another company PharmaWonders Inc., which is also into drug manufacturing business and willing to enter into the same product market, gathered the data that even after the Compulsory License to Medvate Corporation, the invention in the patent in question has still not been worked in India and the reasonable requirement of the public has not been met. Which of the following could be a possible situation under the provision of the Act?
1. PharmaWonders Inc. can only apply for a second CL but may not request for revocation of the patent
2. PharmaWonders Inc. can file a request for revocation of the patent only after the expiration of two years from the date of the order granting the first compulsory license.
3. Only Central Govt. is eligible to apply for revocation of a granted patent for which one CL is already granted.
4. Both PharmaWonders Inc. and Central govt. may file a request for revocation of the patent but only after three years from the date of the order granting the first compulsory license.`,
 ["Only 1","Both 2 and 4","Only 2","None"],"c"),
Q(`Dr. Chinnappa Swaminathan is an ex-employee of Hydra Power Technology (HPT) and was involved in development of Hydrogen technology. He recently came to know about a granted patent obtained by HPT, in which he made a substantial contribution towards the claimed subject matter during his employment. However, his name was not included as an inventor in the granted patent register and complete specification. Dr. Chinnappa Swaminathan is willing to explore the possibilities in the Patents Act to include his name as an inventor in the said granted patent. He does not expect any support from the applicant HPT as their relationship is no longer friendly. In this context which of the following is possible:`,
 ["Dr. Chinnappa Swaminathan can file a Form-8 to include his name as an inventor in the said patent with a statement setting out the circumstances under which this application is made.","Only the applicant/patentee HPT can make a request on form 8 to include Dr. Chinnappa Swaminathan and no other person.","Dr. Chinnappa Swaminathan must seek an approval/consent from the patentee HPT before applying to include his name in the patent","Dr. Chinnappa Swaminathan's name in the patent register and complete specification cannot be included now"],"d"),
Q(`Which of the following ground(s) may NOT be used for availing "Grace period" provision under the Patents Rules:
i. the display of invention occurred with the consent of the true and first inventor or a person deriving title from him at an industrial or other exhibition to which the provisions of the Patents Act have been extended by the Central Government by notification in the Official Gazette
ii. the publication of any description of the invention happened in consequence of the display or use of the invention at any such exhibition
iii. the description of the invention in a paper read by the true and first inventor before a learned society or published with his consent in the transactions of such a society,`,
 ["Only (i) and (ii)","Only (i) and (iii)","Only (iii)","None of the above"],"d"),
Q(`Your client comes to you and expresses his willingness to file an international application. According to the laid down procedure, for international phase of the application, your client (an Indian applicant) needs to choose a competent international searching authority. Govt. of India had recognized few ISA as competent authority for Indian applicants. Which is NOT a competent International Searching Authority under the Act for an Indian Applicant:`,
 ["Australian Patent Office","Japan Patent Office","Austrian Patent Office","Swedish Patent Office"],"b"),
Q(`If
X: Known substance; Y: New form of a known substance;
P: New property or new use of a known substance;
A: Known process, machine, or apparatus;
C: Enhancement of known efficacy; Cᶜ represents the complement of C (meaning no enhancement of efficacy);
Thus, the set of Patentable and Non-patentable inventions under section 3(d) of the Patents Act, 1970 (as amended) can be summarized as:`,
 ["Non-Patentable = (Y∩Cᶜ)∪(P∪A);\nPatentable = (Y∩C)∪(A∩(New Reactant))∪(A∪(New Product))","Patentable = (Y∩Cᶜ)∪(P∪A);\nNon-Patentable = (Y∩C)∪(A∩(New Reactant))∪(A∪(New Product))","Patentable = (Y∩Cᶜ)∪(P∪C);\nNon-Patentable = (Y∩C)∪(A∩(New Reactant))∪(A∪(New Product))","None of above"],"a"),
Q(`Under the Designs Act, who is eligible for filing:
1. A petition for cancellation of a registered design                       a. Any person
2. Application for rectification of register of design                      b. Any person interested
3. Information regarding the existence of registration in respect of design   c. Any person
4. Inspection of and extracts from registers                                    d. Any person aggrieved`,
 ["1-c, 2-a, 3-b, 4-d","1-b, 2-d, 3-a, 4-c","1-d, 2-b, 3-a, 4-c","1-a, 2-d, 3-c, 4-b"],"b"),
Q(`In the journal publication of IPO, a company InnoSol Corporation found that a design is registered which is prejudicial to their business operation. The company therefore approached you for help in order to file a petition for cancellation of the registered design. In this context, which of the following statement(s)/ground(s) is/are applicable for such a petition?
1. Your client should be a person interested
2. The design has been published in some publication in USA and not in India prior to the date of registration
3. Design is not new or original
4. The design contains a property mark`,
 ["Only 2 and 3","Only 1 and 3","Only 3 and 4","All of the above"],"d"),
Q(`Mr Sunil designed a beautiful piece of jewellery and registered a design for the same on 01/01/2023. Few months later, Mr. Kamal came up with a substantially similar design, and is willing to apply it on a different article of same class. Mr. Kamal sees a huge market and business for the upcoming product and is desperate to obtain the design IP. In this context, which of the following is possible under the Designs Act 2000:`,
 ["Mr. Kamal can register the same/substantially same design for a different article of same class where a previous design is already registered by Mr. Sunil","Mr. Kamal will have to become a registered proprietor of the design previously registered by Mr. Sunil, then only the second design as mentioned above may be registered.","Irrespective of proprietor of the registered design, the earlier registered design will always be prejudicial to the newness or originality of any later applied similar design.","All of the above"],"b"),
Q(`Prof. Ranganathan found that one of his students had patented his research work without including his name. You, as his Patent Agent, successfully proved during a post-grant opposition proceeding that the invention so far as claimed in any claim of the complete specification was wrongfully obtained from Prof. Ranganathan in a manner set out in clause (a) of sub-section (2) of section 25. Hence the controller ordered for revocation of the granted patent. Now, in order to amend the patent in the name of Prof. Ranganathan, you are required to file form ______ within ______ months.`,
 ["10, 6","12, 3","17, 3","15, 6"],"b"),
Q(`A patent having a priority date 01/06/2023 was filed in patent office on 01/01/2024. The controller had marked the application for secrecy u/s 35 and sought central govt. permission. A communication was sent to the central govt. Central govt., however, declared the application to be non-prejudicial and consequently the secrecy direction was removed by the controller on 06/06/2024. In the given situation, when can the application be published:`,
 ["Normally within Three months of 06/06/2024","Normally within One month of 01/06/2024","Normally within One month of 01/12/2024","Normally within Three months of 01/01/2025"],"c"),
Q(`A foreign based MNC Enervate Corp filed a patent application on renewable energy systems. During examination, the controller had a doubt that such a device is against the well established law of nature and hence may not be industrially applicable. In order to clear his doubt that the claimed device is not a perpetual motion machine (PMM), the controller asked the applicant to supplement the complete specification with a working model illustrating the alleged invention. In this context what would be permissible under the provision of the Act:`,
 ["A complete specification is always a written document and controller may not ask for additional model or sample to supplement it.","Controller may ask for model or sample, but that shall not be deemed to form part of the complete specification","Controller can ask for model/sample only from the domestic applicants and not from the foreign applicants.","None of the above is true as per the provisions of the Act"],"b"),
Q(`Which of the following is true in respect of registration of design of particular article under the Designs Act:
1. A design may be registered in respect of any or all of the articles comprised in a particular class
2. Controller is the appropriate authority to decide the class of any article
3. A design application shall be invalidated on the ground of the design not being new, as the same design was previously registered in respect of another article belonging to a different class of articles.
4. There are 31 different classes and a miscellaneous class in the classification system for design registration.`,
 ["All are true","Only 1, 2 and 3 are true","None is true","1, 2 and 4 are true"],"d"),
Q(`Under the Patents Act, 1970, the provision of revocation of a granted patent in public interest is an important aspect to balance the monopolistic rights with public interest. In reference to the same, which of the following is the Correct option:`,
 ["Where the Central Government or State Government is of opinion that a patent or the mode in which it is exercised is prejudicial to the public, it may make a declaration to that effect in the Official Gazette and thereupon the patent shall be deemed to be revoked.","Where the Central Government is of opinion that a patent was wrongly granted overlooking the provisions of section 3 of the Patents Act, it may direct the Controller to revoke the same and make publication to that effect.","Where the High Court is of opinion that a patent or the mode in which it is exercised is mischievous to the State or generally prejudicial to the public, it may, after giving the patentee an opportunity to be heard, make a declaration to that effect in the Official Gazette and thereupon the patent shall be deemed to be revoked.","Where the Central Government is of opinion that a patent or the mode in which it is exercised is mischievous to the State or generally prejudicial to the public, it may, after giving the patentee an opportunity to be heard, make a declaration to that effect in the Official Gazette and thereupon the patent shall be deemed to be revoked."],"d"),
Q(`A patent was granted to an invention titled "Storage facility" on 19/05/2022. On 22/08/2023, the Central Government is satisfied that the granted patent is disguised in its title and in reality it is for an invention relating to atomic energy for which no patent can be granted under sub-section (1) of section 20 of the Atomic Energy Act, 1962 (33 of 1962). In this regard, which of the following(s) is/are correct statement(s):
i. Central Government may direct the Controller to revoke the patent,
ii. On direction of Central Government the Controller, after giving notice to the patentee and every other person whose name has been entered in the register as having an interest in the patent, and after giving them an opportunity of being heard, may revoke the patent.
iii. The Controller may allow the patentee to amend the complete specification in such manner as he considers necessary instead of revoking the patent.`,
 ["Only (i)","Only (i) and (ii)","All (i), (ii) and (iii)","None of the above"],"c"),
Q(`If a patent application fails to disclose or wrongly mentions the source or geographical origin of biological material used for the invention, which of the following action is NOT possible:
i. A pre-grant opposition may be filed against such application for patent on this ground
ii. It can be used as a ground for filing post-grant opposition
iii. A petition for revocation can be filed on this ground
iv. Controller can suo-moto revoke such patent, if already granted`,
 ["Only (iv)","Only (i) and (ii)","Only (i), (ii) and (iii)","None of the above"],"a"),
Q(`A patent was granted on 10/06/2022 to CanSon Pvt. Ltd. On 03/08/2022, they issued a cease-and-desist notice to its competitor Alma Private Limited, stating that the latter's planned product "KONDUCT" infringes on their patent for the composition sold under the name "REWIRE". CanSon asserts exclusive rights granted under the Patents Act, 1970. Which of the following statements is correct?`,
 ["Alma Private Limited has sufficient time to file a post grant opposition on the grounds of the cease-and-desist notice dated 03/08/2022","Alma Private Limited has sufficient time to file a post grant opposition under section 25(2) of the Act on the grounds listed in clauses (a) to (k), and on no other grounds","Alma Private Limited has sufficient time to file a post grant opposition under section 25(1) of the Act on the grounds listed in clauses (a) to (k), and on no other grounds","None of above"],"b"),
Q(`In an infringement suit, your client managed to convince the court that part of the claims of the Patentee is wrongfully obtained from him. What could be the possible consequences of the above situation under the provision of the Act:
i. The patent shall be revoked in totality
ii. The patent shall be amended excluding the claims in contest
iii. The entire Patent right may be shifted/granted to your client in a petition
iv. A Patent may be granted to your client for the claims wrongfully obtained by the patentee.`,
 ["Only i and iii","Only ii and iv","Only ii and iii","Only i and iv"],"b"),
Q(`An Indian resident Dr. Pandit filed a patent application with the European Patent Office (EPO) on January 1, 2022. The application entered into India through the conventional route on December 23, 2022. After receiving a First Examination Report (FER), the applicant received an objection related to the written permission under Section 39, which requires prior permission for filing patents outside India. In response to this objection, the applicant submitted a request for post facto permission under Section 39 by filing form 25 after receiving the FER. Which of the following statements is correct?`,
 ["Post facto permission under Section 39 can be obtained by filing Form 25 when the application has entered India through the conventional route.","Permission under Section 39 by filing Form 25 is required only for PCT applications.","His application for a patent under this Act shall be deemed abandoned under Section 40.","There is no need to obtain permission under Section 39 when the application has entered India through the conventional route."],"c"),
Q(`Ms. Shivagami Devi has qualified the patent agent exam and wants to get her name registered in the Patent Agent Register. She will file her details by filing ______. Later after 4 years, due to not filing of the fee, her name was removed from the register. She rectified the mistake and wants her name to be restored in the register. She needs to apply for the same on ______.`,
 ["Form-22, Form-23","Form-23, Form-22","Form-22, Form-20","Form-21, Form-20"],"a"),
Q(`Mr. Sundaram makes an application for registration of a design under certain class. However, due to some negligence on the part of the applicant, the application got abandoned. However, he decides to make a fresh application again for the same design. In this context, which of the following is/are true:
1. The first application shall become a prior art for the fresh application.
2. Once abandoned, it was not possible to make a fresh application for the same design.
3. It is possible to make a fresh application on the same design if the earlier application is abandoned, and the earlier one may not be a prior art.
4. It is not possible to make the fresh application in the same class.`,
 ["All of the above","Only 3","Only 3 and 4","Only 1, 2 and 3"],"b"),
Q(`Which of the following ground of revocation is not a ground of post grant opposition?`,
 ["that the subject of any claim of the complete specification is not an invention within the meaning of this Act;","that the invention so far as claimed in any claim of the complete specification is obvious or does not involve any inventive step, having regard to what was publicly known or publicly used in India or what was published in India or elsewhere before the priority date of the claim;","that the applicant contravened any direction for secrecy passed under section 35 or made or caused to be made an application for the grant of a patent outside India in contravention of section 39;","None of above"],"c"),
Q(`As per the definition provided in the Patents Act, 1970 (as amended), "capable of industrial application", in relation to an invention, means that the invention is capable of being ______ or ______ in ______;`,
 ["manufactured, used, an industry","made, utilised, an industry","produced, exported, an industry","made, used, an industry"],"d"),

/* =====================================================================
   RENDER
   ===================================================================== */
const YEAR = Y2025;
const totalQuestions = YEAR.filter(item => item.o).length;
const maxMarks = YEAR.filter(item => item.o).reduce((sum, item) => sum + item.m, 0);

document.getElementById('total').textContent = totalQuestions;
document.getElementById('maxmarks').textContent = maxMarks;

const quizEl = document.getElementById('quiz');
const footEl = document.getElementById('foot');
let attempted = 0, correct = 0, wrong = 0, marks = 0;
const answered = new Set();

let globalQ = 1;
let html = '';

YEAR.forEach((section) => {
  if (section.s) {
    html += `<h2 class="sechead">${section.s}</h2>`;
  } else if (section.t) {
    const q = section;
    const qIndex = globalQ++;
    const qId = `q${qIndex}`;
    const isMulti = q.a.includes(',');
    const letters = ['a','b','c','d'];

    html += `<div class="qcard" data-qid="${qId}" data-marks="${q.m}" data-answer="${q.a}">`;
    html += `<div class="qtitle"><span class="qnum">${qIndex}</span>${q.t}</div>`;
    if (isMulti) {
      html += `<div class="multi">Multiple correct answers</div>`;
    }
    q.o.forEach((opt, i) => {
      html += `<button class="opt" data-opt="${letters[i]}" onclick="selectOption(this)"><b>${letters[i].toUpperCase()}</b><span>${opt}</span></button>`;
    });
    if (isMulti) {
      html += `<button class="check" onclick="checkMulti(this)" disabled>Check answer</button>`;
    }
    html += `</div>`;
  }
});

quizEl.innerHTML = html;
footEl.innerHTML = `Patent Agent Examination · 2025 Practice Paper · ${totalQuestions} questions · ${maxMarks} marks`;

/* ---------- selection / checking ---------- */
function selectOption(btn) {
  const card = btn.closest('.qcard');
  if (card.dataset.done === '1') return;
  const answer = card.dataset.answer;
  const isMulti = answer.includes(',');
  const letters = ['a','b','c','d'];
  const opts = card.querySelectorAll('.opt');

  if (!isMulti) {
    const chosen = btn.dataset.opt;
    if (card.dataset.done === '1') return;

    card.dataset.done = '1';
    const qid = card.dataset.qid;
    if (answered.has(qid)) return;
    answered.add(qid);

    const isCorrect = chosen === answer;
    opts.forEach(o => {
      o.disabled = true;
      const val = o.dataset.opt;
      if (val === answer) o.classList.add('correct');
      if (val === chosen && !isCorrect) o.classList.add('wrong');
    });
    if (isCorrect) {
      correct++;
      marks += parseFloat(card.dataset.marks);
    } else {
      wrong++;
    }
    attempted++;
    updateScore();
  } else {
    // multi-select: toggle selection
    if (!btn.classList.contains('sel')) {
      btn.classList.add('sel');
    } else {
      btn.classList.remove('sel');
    }
    const checkBtn = card.querySelector('.check');
    const anySelected = card.querySelectorAll('.opt.sel').length > 0;
    checkBtn.disabled = !anySelected;
  }
}

function checkMulti(btn) {
  const card = btn.closest('.qcard');
  if (card.dataset.done === '1') return;
  card.dataset.done = '1';
  const qid = card.dataset.qid;
  if (answered.has(qid)) return;
  answered.add(qid);

  const answer = card.dataset.answer.split(',').sort().join(',');
  const opts = card.querySelectorAll('.opt');
  let selected = [];
  opts.forEach(o => {
    if (o.classList.contains('sel')) {
      selected.push(o.dataset.opt);
    }
    o.disabled = true;
  });
  selected.sort();
  const chosen = selected.join(',');
  const isCorrect = chosen === answer;

  opts.forEach(o => {
    const val = o.dataset.opt;
    if (answer.includes(val)) o.classList.add('correct');
    if (selected.includes(val) && !answer.includes(val)) o.classList.add('wrong');
  });

  if (isCorrect) {
    correct++;
    marks += parseFloat(card.dataset.marks);
  } else {
    wrong++;
  }
  attempted++;
  updateScore();
  btn.disabled = true;
}

function updateScore() {
  document.getElementById('attempted').textContent = attempted;
  document.getElementById('correct').textContent = correct;
  document.getElementById('wrong').textContent = wrong;
  document.getElementById('marks').textContent = marks;
  const pct = totalQuestions > 0 ? (attempted / totalQuestions * 100) : 0;
  document.getElementById('bar').style.width = pct + '%';
}

document.getElementById('resetBtn').addEventListener('click', () => {
  attempted = 0; correct = 0; wrong = 0; marks = 0; answered.clear();
  updateScore();
  document.querySelectorAll('.qcard').forEach(card => {
    card.dataset.done = '';
    card.querySelectorAll('.opt').forEach(o => {
      o.classList.remove('sel', 'correct', 'wrong');
      o.disabled = false;
    });
    const chk = card.querySelector('.check');
    if (chk) { chk.disabled = true; }
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

updateScore();
</script>

  <script src="timer.js"></script>
