<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patent Agent Examination — 2024 Practice Quiz</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --ink:#1f2430;
    --muted:#6b7280;
    --accent:#4f46e5;
    --accent-dark:#4338ca;
    --ok:#1a7f4b;
    --ok-bg:#e8f7ef;
    --ok-line:#9ad4b5;
    --bad:#b42318;
    --bad-bg:#fdecea;
    --bad-line:#f3b4ad;
    --line:#e3e6ec;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    padding:2rem 1rem 4rem;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55;
    font-size:16px;
  }
  .wrap{max-width:820px;margin:0 auto}

  .homebar{display:flex;justify-content:center;margin-bottom:1.2rem}
  .homebar a{
    font-size:.9rem;font-weight:600;text-decoration:none;color:var(--accent);
    padding:.4rem 1rem;border:1px solid var(--line);border-radius:10px;background:#fff;
  }
  .homebar a:hover{border-color:var(--accent)}

  header{text-align:center;margin-bottom:1.6rem}
  header h1{margin:0 0 .35rem;font-size:1.6rem;letter-spacing:-.02em}
  header p{margin:0;color:var(--muted);font-size:.94rem}

  .summary{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:1.1rem 1.2rem;
    margin-bottom:1.3rem;
    box-shadow:0 2px 10px rgba(20,30,60,.05);
  }
  .summary h2{margin:0 0 .6rem;font-size:1.15rem}
  .score-line{font-size:1.02rem;margin:0 0 .8rem}
  .score-line b{font-size:1.35rem;color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:.45rem;margin:0;padding:0;list-style:none}
  .chip{
    font-size:.85rem;font-weight:600;padding:.28rem .7rem;border-radius:999px;
    border:1px solid var(--line);background:#fbfcff;color:var(--muted);
  }
  .chip.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
  .chip.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:1.15rem 1.25rem 1.25rem;
    margin-bottom:1.1rem;
    box-shadow:0 2px 10px rgba(20,30,60,.05);
  }
  .card.correct{border-left:5px solid var(--ok)}
  .card.wrong{border-left:5px solid var(--bad)}

  .section-head{
    margin:1.6rem 0 .6rem;
    font-weight:700;
    font-size:.88rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--accent);
  }

  .qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:.6rem;margin-bottom:.5rem}
  .qnum{
    font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;
    color:#fff;background:var(--accent);padding:.2rem .6rem;border-radius:6px;
  }
  .qmeta{font-size:.8rem;color:var(--muted)}
  .qtext{margin:.15rem 0 .9rem;font-weight:600;white-space:pre-line}

  .options{display:grid;gap:.5rem}
  .option{
    display:flex;gap:.65rem;align-items:flex-start;
    padding:.6rem .75rem;border:1px solid var(--line);border-radius:10px;
    background:#fff;cursor:pointer;transition:border-color .15s,background .15s;
  }
  .option:hover{border-color:#c3cbe0;background:#fafbff}
  .option input{margin-top:.3rem;accent-color:var(--accent);flex:none}
  .option .txt{font-size:.95rem}
  .option .txt b{color:var(--accent-dark)}
  .option.locked{cursor:default}
  .option.locked:hover{border-color:var(--line);background:#fff}

  .option.is-correct{border-color:var(--ok-line);background:var(--ok-bg)}
  .option.is-correct:hover{background:var(--ok-bg)}
  .option.is-wrong{border-color:var(--bad-line);background:var(--bad-bg)}
  .option.is-wrong:hover{background:var(--bad-bg)}

  .feedback{margin-top:.9rem;padding-top:.85rem;border-top:1px dashed var(--line);display:none}
  .feedback.show{display:block}
  .verdict{font-weight:700;margin:0 0 .45rem}
  .verdict.ok{color:var(--ok)}
  .verdict.bad{color:var(--bad)}
  .feedback p{margin:.25rem 0;font-size:.92rem}
  .feedback .lbl{color:var(--muted);font-weight:600}
  .feedback .reason{margin-top:.55rem;padding:.6rem .75rem;background:#f7f8fc;border-radius:9px;color:#333a4a}

  .actions{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem;margin:1.4rem 0 .4rem}
  .btn{
    font:inherit;font-weight:600;border-radius:10px;padding:.7rem 1.4rem;
    border:1px solid transparent;cursor:pointer;transition:.15s;
  }
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--accent-dark)}
  .btn.primary:disabled{background:#c3cbe0;cursor:not-allowed}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .btn.ghost:hover{border-color:#b9c2d6}
  .hint{color:var(--muted);font-size:.88rem}

  .hidden{display:none !important}
  @media (max-width:520px){
    body{padding:1.2rem .7rem 3rem;font-size:15px}
    .card{padding:1rem}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="homebar">
    <a href="index.html">&#8592; Home</a>
  </div>

  <header>
    <h1>Patent Agent Examination — 2024</h1>
    <p>Paper I practice &middot; 50 questions &middot; Select your answers and press Submit.</p>
  </header>

  <div id="summary" class="summary hidden" aria-live="polite">
    <h2>Result</h2>
    <p class="score-line" id="scoreLine"></p>
    <ul class="chips" id="chips"></ul>
  </div>

  <form id="quiz" autocomplete="off"></form>

  <div class="actions">
    <button id="submitBtn" class="btn primary" type="button" disabled>Submit all answers</button>
    <button id="resetBtn" class="btn ghost" type="button">Reset</button>
    <span id="hint" class="hint">Answer all questions to submit.</span>
  </div>

</div>

<script>
(function () {
  "use strict";

  /* =====================================================================
     QUESTION DATA — 2024 paper
     Each entry: { section, qtext, options: [{label, text}], correct: [indices], reason }

  var QUESTIONS = [
    /* ----- Part A : Multiple Choice (2 marks) ----- */
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "In a revocation proceeding in Court, Dr. Desai was able to prove that a patent granted to one of his students Mr. Rohan was wrongfully obtained. Post Court's revocation order and permission of grant of the whole patent to him, Dr. Desai files a petition before the Controller to grant the said patent in his name. What would be the date of patent granted to Dr. Desai after such proceeding:",
      options: [
        { label: "a", text: "Date on which controller revokes the patent" },
        { label: "b", text: "International filing date" },
        { label: "c", text: "Same as revoked patent" },
        { label: "d", text: "Date on which controller grant a new patent" }
      ],
      correct: [2],
      reason: "Option (c). When a patent is revoked and granted to the rightful owner, the new patent carries the same date as the revoked patent."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "Ms. Ragini has composed an interesting and soothing Raga composition. This Raga can be used in yoga, meditation, medication to relax or treat patients suffering from anxiety and depression. She would like to protect her IP rights. Which is the most appropriate IP Act for her to apply for protection:",
      options: [
        { label: "a", text: "The Copyright Act, 1957" },
        { label: "b", text: "The Trade Marks Act, 1999" },
        { label: "c", text: "The Patents Act, 1970" },
        { label: "d", text: "The Designs Act, 2000" }
      ],
      correct: [0],
      reason: "Option (a). A musical composition (Raga) is protected under the Copyright Act, 1957 as a musical work."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "A novel sunscreen formulation 'AlZo' is made by mixing jojoba oil and Almond oil in a certain ratio along with other excipients. The sunscreen formulation is patentable if:",
      options: [
        { label: "a", text: "SPF value of jojoba oil = SPF value of Almond oil = SPF value of sunscreen 'AlZo'" },
        { label: "b", text: "(SPF value of jojoba oil + SPF value of Almond oil) = SPF value of sunscreen 'AlZo'" },
        { label: "c", text: "(SPF value of jojoba oil + SPF value of Almond oil) < SPF value of sunscreen 'AlZo'" },
        { label: "d", text: "(SPF value of jojoba oil + SPF value of Almond oil) > SPF value of sunscreen 'AlZo'" }
      ],
      correct: [2],
      reason: "Option (c). For a combination to be patentable, it must show synergistic effect — the combined SPF must be greater than the sum of individual SPFs."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "Under the Doctrine of National treatment, as regards to the protection of industrial property, each country must grant the same protection as it grants to its own nationals, to\ni. Nationals of the other member countries of Paris Convention\nii. Nationals of all member countries of United Nations\niii. Nationals of all the countries of Paris Convention but the same legal remedy against infringement of their rights is not available to nationals of those countries with which it fought wars in the past\niv. Nationals of countries that are not party to the Paris Convention if they are domiciled in a member country or if they have a real and effective industrial or commercial establishment in such a country.",
      options: [
        { label: "a", text: "Only (i)" },
        { label: "b", text: "Only (i) and (iii)" },
        { label: "c", text: "Only (iii)" },
        { label: "d", text: "Only (i) and (iv)" }
      ],
      correct: [3],
      reason: "Option (d). National treatment applies to nationals of Paris Convention member countries (i) and to non-party nationals domiciled or with effective establishment in a member country (iv)."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "Mr. Ramayuna filed an application for the grant of patent with provisional specification on 06/11/2012 in Patent Office, Delhi. Subsequently, complete specification was filed on 05/11/2013. As per the provisions of section 13, the examiner after conducting the prior art search shall report:\ni. Patent literatures anticipating the claims and published before 05/11/2013\nii. Patent literatures wherein the invention as claimed in Mr. Ramayuna's application is claimed in any claim of complete specification published after 05/11/2013 but having priority before 06/11/2012 and filed in India\niii. Non-Patent literatures anticipating the claims and published before 05/11/2013",
      options: [
        { label: "a", text: "Only (i)" },
        { label: "b", text: "Only (i) and (ii)" },
        { label: "c", text: "Only (ii) and (iii)" },
        { label: "d", text: "All of the above" }
      ],
      correct: [3],
      reason: "Option (d). The examiner reports all prior art: patent literature published before the complete specification date (i), prior claiming in Indian applications (ii), and non-patent literature (iii)."

    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "Over the years in the field of IPRs significant Indian jurisprudence has got created with regard to various aspects of patenting in India. Match the following case laws with their relevant focus:\n1. Biswanath Prasad Radhey Shyam Vs Hindustan Metal Industries Ltd        a. Post Dating\n2. Standipack Pvt. Ltd. Vs M/s Oswal Trading Co. Ltd.                                  b. Person skilled in the art and Inventive Step\n3. Novartis AG Vs Union of India                                                                     c. Software related Patents\n4. Ferid Allani Vs Union of India                                                                      d. Therapeutic Efficacy",
      options: [
        { label: "a", text: "1-b, 2-a, 3-c, 4-d" },
        { label: "b", text: "1-d, 2-a, 3-c, 4-b" },
        { label: "c", text: "1-a, 2-b, 3-d, 4-c" },
        { label: "d", text: "1-b, 2-a, 3-d, 4-c" }
      ],
      correct: [3],
      reason: "Option (d). Biswanath Prasad — inventive step (1-b); Standipack — post dating (2-a); Novartis — therapeutic efficacy (3-d); Ferid Allani — software patents (4-c)."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "Match the following examples which are not patentable under relevant clauses of the Act:\n1. Section 3(j)   a. Turmeric aqueous extract for pimple care\n2. Section 3(h)   b. Method of aerating soil for improved yield in agriculture\n3. Section 3(i)    c. Method of surgical removal of teeth\n4. Section 3(p)   d. Isolated insulin gene\n5. Section 3(c)    e. Mouse cell",
      options: [
        { label: "a", text: "1-a, 2-c, 3-b, 4-d, 5-e" },
        { label: "b", text: "1-e, 2-b, 3-c, 4-a, 5-d" },
        { label: "c", text: "1-a, 2-b, 3-d, 4-e, 5-c" },
        { label: "d", text: "1-c, 2-a, 3-d, 4-b, 5-e" }
      ],
      correct: [1],
      reason: "Option (b). Section 3(j): mouse cell (1-e); 3(h): method of aerating soil (2-b); 3(i): surgical method (3-c); 3(p): turmeric extract (4-a); 3(c): isolated insulin gene (5-d)."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "Dr. Sunita wants to file a patent application involving gene and protein data in India. As a patent agent, you advise her that she also needs to file the sequence listing of nucleotides or amino acid sequences. The correct way for filing sequence listing in India is:",
      options: [
        { label: "a", text: "the sequence listing shall be filed in computer readable text format along with the application, and no print form of the sequence listing is required to be given" },
        { label: "b", text: "the sequence listing shall be filed in normal format same as the application, and no print form of the sequence listing is required to be given" },
        { label: "c", text: "the sequence listing shall be filed in computer readable text format along with the application, and print form of the sequence listing is required to be given" },
        { label: "d", text: "the sequence listing shall be filed in same format as that of the application, and print form of the sequence listing is required to be given" }
      ],
      correct: [0],
      reason: "Option (a). Sequence listings are filed in computer-readable text format, and no print form is required in India."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "Mr. Madhav is a plant science researcher specialized in developing transgenic rice. After he quits from his organization, his organization has filed a patent application based on Madhav's work and the same was granted with several of his colleagues as inventors. Mr. Madhav came across this news in a newspaper that a patent has been granted this month for the transgenic rice developed by him. But Mr. Madhav's name is not mentioned as inventor. He consults you. What among these options will be your correct advice as per the provisions of the Act:",
      options: [
        { label: "a", text: "Madhav can file a post grant opposition u/s 25(1) with form 7 and fee" },
        { label: "b", text: "Madhav can file a post grant opposition u/s 25(2) with form 7A and without any fee" },
        { label: "c", text: "Madhav can file a post grant opposition u/s 25(1) with form 7A and fee" },
        { label: "d", text: "Madhav can file a post grant opposition u/s 25(2) with form 7 and fee" }
      ],
      correct: [3],
      reason: "Option (d). Post-grant opposition under Section 25(2) is filed on Form 7 with the prescribed fee. Wrongful obtaining of the invention is a ground under Section 25(2)(a)."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "Dr Sita filed a provisional application for an innovative beeper technology on 01/01/2018. The timeline to file the complete application is near, however the same is not complete and she needs few more months. Dr. Sita consults you for professional advice. The possible correct option is:",
      options: [
        { label: "a", text: "Dr. Sita can post date the application for a maximum of 3 months at once if she files the request for post-dating before 01/04/2019" },
        { label: "b", text: "Dr. Sita could file petition under rule 138 for extension of period for filing complete specification by 1 more month" },
        { label: "c", text: "Dr. Sita can post date the application for a maximum of 6 months by applying for it anytime before the term of patent expires" },
        { label: "d", text: "Dr. Sita can post date the application for a maximum of 6 months, provided she requests for post-dating the application before 01/01/2019" }
      ],
      correct: [3],
      reason: "Option (d). Post-dating can extend the deadline by up to 6 months, but the request must be made before the original 12-month period expires (i.e., before 01/01/2019)."

        { label: "a", text: "They cannot file any PCT international application jointly as Ms. Prakshi is not a national/resident of PCT contracting state" },
        { label: "b", text: "They can file jointly as Mr. John is a resident/national of PCT contracting state" },
        { label: "c", text: "Ms. Prakshi need to sign an affidavit about non-resident of PCT-State and then they can jointly file" },
        { label: "d", text: "They both can make a joint declaration under PCT Rule 34 bis(i) to become eligible to file joint PCT international application" }
      ],
      correct: [1],
      reason: "Option (b). At least one applicant must be a national or resident of a PCT contracting state. Since Mr. John qualifies, they can file jointly."

      options: [
        { label: "a", text: "1-a, 2-b, 3-d, 4-e, 5-c" },
        { label: "b", text: "1-b, 2-c, 3-e, 4-a, 5-d" },
        { label: "c", text: "1-e, 2-d, 3-c, 4-a, 5-b" },
        { label: "d", text: "1-e, 2-d, 3-b, 4-a, 5-c" }
      ],
      correct: [3],
      reason: "Option (d). Publicly known/used: 25(1)(e) (1-e); Obviousness: 25(1)(d) (2-d); Prior anticipation: 25(1)(b) (3-b); Claims not patentable: 25(1)(a) (4-a); Wrongfully obtained: 25(1)(c) (5-c)."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "Mr. Neelesh started a business of making sports shoes. He realized that some companies used patented technologies to claim higher price for their product. Being fancied, he decided to put a stamp 'patented' on his article without actually filing any patent. What would be possible consequences as per the provisions of the Act:",
      options: [
        { label: "a", text: "He shall be punishable with imprisonment" },
        { label: "b", text: "He shall be liable to fine/penalty" },
        { label: "c", text: "He may be punishable with both fine and imprisonment" },
        { label: "d", text: "He will be warned by patent office first for first offence without any fine/penalty and then for subsequent offences shall be liable for fine or imprisonment or both." }
      ],
      correct: [1],

    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "Mr. Alpha has two patent applications filed on valve structure of an IC Engine. The first application A was filed on 01/04/2019 and the second application B, which actually is an improvement on first application, was filed on 31/03/2019. Both the applications proceeded to grant of patents individually. Application A was granted on 01/07/2022 and application B was granted on 30/10/2022. However, Mr. Alpha later on came to know about the provisions and related benefits of patent of addition and requested the controller to revoke the patent B and convert the same as patent of addition of patent A. In this context, select the correct option:",
      options: [
        { label: "a", text: "It is possible to convert B to a patent of addition of A" },
        { label: "b", text: "It is not possible to convert B to a patent of addition of A" },
        { label: "c", text: "It is possible to convert B on condition that the patent term of B will co-terminate with A" },
        { label: "d", text: "None of the above" }
      ],
      correct: [1],
      reason: "Option (b). A patent of addition must be filed on or after the main application. Here B was filed before A, so B cannot be converted to a patent of addition of A."
    },
    {
      section: "Part A — Multiple Choice (2 marks each)",
      qtext: "Which of the following statements regarding WIPO services are correct:\ni. WIPO DAS is an electronic system to access priority document to be securely exchanged between participatory countries\nii. WIPO CASE enables different patent offices to securely share priority document and translation thereof\niii. WIPO CASE is an arrangement for work-sharing between offices\niv. India is a participating country to WIPO DAS but not WIPO CASE",
      options: [
        { label: "a", text: "Only (i) and (ii)" },
        { label: "b", text: "Only (i) and (iii)" },

        { label: "d", text: "All are correct" }
      ],

      options: [
        { label: "a", text: "Only (i)" },
        { label: "b", text: "Only (ii)" },
        { label: "c", text: "Both (i) and (ii)" },

    {

    {
      section: "Part A — Multiple Choice (2 marks each)",

      options: [
        { label: "a", text: "1-c, 2-b, 3-d, 4-a, 5-e" },
        { label: "b", text: "1-c, 2-d, 3-a, 4-b, 5-e" },
        { label: "c", text: "1-c, 2-d, 3-b, 4-a, 5-e" },
        { label: "d", text: "1-a, 2-d, 3-b, 4-c, 5-e" }
      ],
      correct: [2],
      reason: "Option (c). PCT — patents (1-c); Hague — industrial designs (2-d); Berne — copyright (3-b); Madrid — trademarks (4-a); Budapest — deposit of microorganisms (5-e)."
    },

      options: [
        { label: "a", text: "Only (i), (ii) and (iii)" },
        { label: "b", text: "Only (i) and (ii)" },
        { label: "c", text: "Only (i), (ii) and (iv)" },
        { label: "d", text: "Only (i) and (iii)" }
      ],
      correct: [3],
      reason: "Option (d). Every patentee must file Form 27 (i), and joint patentees may file jointly (iii). Exclusive/non-exclusive licensees are not required to file Form 27 (ii is false), and different licensees cannot file jointly (iv is false)."
    },
    {
      section: "Part C — Multiple Choice (3 marks each)",
      qtext: "Look at the table below:\nTopic                                                                            Form            Relevant Section and Rules\n1. Restoration of Lapsed Patents                                     I. Form 3       A. Section 57, Rule 81(1)\n2. Statement and Undertaking regarding foreign application  II. Form 7     B. Section 8, Rule 12\n3. Notice of Opposition                                                    III. Form 13    C. Section 60, Rule 84\n4. Application for Amendment of application/complete specification/other related documents   IV. Form 15   D. Section 25(2), Rule 55A\n\nWith reference to the table above, which of the following options is NOT matching the provisions of the Act correctly?",
      options: [
        { label: "a", text: "1-IV-C" },
        { label: "b", text: "2-I-B" },
        { label: "c", text: "3-IV-A" },
        { label: "d", text: "4-III-A" }
      ],
      correct: [2],
      reason: "Option (c) — 3-IV-A is NOT matching. Notice of opposition is Form 7 under Section 25(2) and Rule 55A, not Form 15 under Section 57."
    },
    {
      section: "Part C — Multiple Choice (3 marks each)",
      qtext: "Jack and Jill ventured up the hill and encountered the welcoming Oompa-Dumpa tribe, who graciously offered them a revitalizing root to chew. Overwhelmed by its unique and refreshing flavor, they expressed their gratitude and took the opportunity to gather plant samples before returning home. With great care and respect, they developed this extraordinary find into a delightful chocolate product, patented it, and introduced it to the market where it received an overwhelmingly positive response. They request your professional advice regarding how to proceed with sharing the benefits with the tribe. Which among the following are appropriate option(s):\ni. To partnership with the tribe, ensuring fair compensation for their cultural knowledge and contribution\nii. A percentage of the profits from the chocolate's success may be directed back to the tribe, for supporting their community and preserving their traditions\niii. Profits may be used to uplift the lives of the tribal community that had shared their wisdom\niv. To keep all profits for themselves, acknowledging the tribe privately\nv. Share a percentage of profits with the Oompa-Dumpa tribe as fair compensation\nvi. Make a one-time charitable donation unrelated to the tribe's contribution\nvii. Disregard any obligation to share benefits with the tribe due to the discovery process",
      options: [
        { label: "a", text: "Only iv, vi and vii" },
        { label: "b", text: "Only i, iv, v and vii" },
        { label: "c", text: "Only iv, v, vi and vii" },
        { label: "d", text: "Only i, ii, iii and v" }
      ],
      correct: [3],
      reason: "Option (d). Appropriate benefit-sharing options include partnership (i), profit-sharing (ii), community upliftment (iii), and fair compensation (v). Keeping profits (iv), unrelated donations (vi), and disregarding obligations (vii) are not appropriate."
    },
    {
      section: "Part C — Multiple Choice (3 marks each)",
      qtext: "Mr. Allu's name was removed from register of Patent Agent on 25/03/2023. Now, Mr. Allu wants to file an application for restoration of his name in the register of Patent Agents. Regarding this:\ni. Application for restoration of name in the register of Patent Agents can only be made after 25/05/2023\nii. Application for restoration of name in the register of Patent Agents can only be made within 25/05/2023\niii. Application for restoration of name in the register of Patent Agents can be made on Form-23 by Mr. Allu\niv. Application for restoration of name in the register of Patent Agents can be made on Form-22 by Mr. Allu",
      options: [
        { label: "a", text: "Only (ii) and (iii)" },
        { label: "b", text: "Only (i) and (iii)" },
        { label: "c", text: "None are correct" },
        { label: "d", text: "All are correct" }
      ],
      correct: [0],
      reason: "Option (a). Restoration must be applied within 2 months of removal (by 25/05/2023) (ii) on Form 23 (iii). It cannot be made after that date (i is false), and Form 22 is for registration, not restoration (iv is false)."
    },
    {
      section: "Part C — Multiple Choice (3 marks each)",
      qtext: "Dr. Sudha is unable to exploit her patent commercially. None of the dealers or companies in the same field approached her for commercial deals and assignments. She is unable to maintain the patent nor file renewal fee. What among the following options are correct with respect to surrendering her patent:\ni. Dr. Sudha could give notice to controller offering to surrender her patent u/s 63\nii. By surrendering her patent under section 63 she could claim refund of fees paid to patent office\niii. The controller based on her surrender request under section 63 may accept the offer and, by order, revoke the patent following due procedure of opposition proceedings, if any\niv. The controller based on her surrender request under section 62 may accept the offer and, by order, revoke the patent following due procedure of opposition proceedings, if any\nv. The controller based on her surrender request under section 62 may accept the offer and she could claim refund of fees paid to patent office",
      options: [
        { label: "a", text: "Only (ii) and (iii)" },
        { label: "b", text: "Only (i) and (iii)" },
        { label: "c", text: "Only (iv) and (v)" },
        { label: "d", text: "None are correct" }
      ],
      correct: [1],
      reason: "Option (b). Under Section 63, the patentee may surrender the patent (i), and the Controller may accept and revoke after due opposition proceedings (iii). No refund of fees is available (ii is false), and Section 62 deals with a different matter (iv and v are false)."

  /* =====================================================================
     RENDER & LOGIC
     ===================================================================== */
  var form      = document.getElementById("quiz");
  var submitBtn = document.getElementById("submitBtn");
  var resetBtn  = document.getElementById("resetBtn");
  var hint      = document.getElementById("hint");
  var summary   = document.getElementById("summary");
  var scoreLine = document.getElementById("scoreLine");
  var chips     = document.getElementById("chips");

  var submitted = false;

  /* ---------- Build question cards ---------- */
  function buildQuiz() {
    form.innerHTML = "";
    var lastSection = "";

    QUESTIONS.forEach(function (q, idx) {
      if (q.section && q.section !== lastSection) {
        lastSection = q.section;
        var sec = document.createElement("div");
        sec.className = "section-head";
        sec.textContent = q.section;
        form.appendChild(sec);
      }

      var card = document.createElement("section");
      card.className = "card";
      card.id = "card-q" + idx;

      var head = document.createElement("div");
      head.className = "qhead";
      var num = document.createElement("span");
      num.className = "qnum";
      num.textContent = "Q" + (idx + 1);
      head.appendChild(num);
      card.appendChild(head);

      var qtext = document.createElement("p");
      qtext.className = "qtext";
      qtext.textContent = q.qtext;
      card.appendChild(qtext);

      var optsWrap = document.createElement("div");
      optsWrap.className = "options";

      q.options.forEach(function (opt, oi) {
        var label = document.createElement("label");
        label.className = "option";

        var input = document.createElement("input");
        input.type = "checkbox";
        input.name = "q" + idx;
        input.value = oi;

        var txt = document.createElement("span");
        txt.className = "txt";
        txt.innerHTML = "<b>(" + opt.label + ")</b> " + opt.text;

        label.appendChild(input);
        label.appendChild(txt);
        optsWrap.appendChild(label);
      });

      card.appendChild(optsWrap);

      var fb = document.createElement("div");
      fb.className = "feedback";
      fb.id = "fb-q" + idx;
      card.appendChild(fb);

      form.appendChild(card);
    });
  }

  /* ---------- Helpers ---------- */
  function inputsFor(idx) {
    return Array.prototype.slice.call(
      document.querySelectorAll('input[name="q' + idx + '"]')
    );
  }

  function selectionFor(idx) {
    return inputsFor(idx)
      .filter(function (i) { return i.checked; })
      .map(function (i) { return parseInt(i.value, 10); });
  }

  function labelOf(input) {
    return input.closest("label");
  }

  function pretty(values) {
    if (!values.length) return "—";
    return values.map(function (v) {
      return "(" + String.fromCharCode(97 + v) + ")";
    }).join(", ");
  }

  function refreshState() {
    if (submitted) return;
    var answered = QUESTIONS.filter(function (q, idx) {
      return selectionFor(idx).length > 0;
    }).length;
    submitBtn.disabled = answered < QUESTIONS.length;
    hint.textContent = answered < QUESTIONS.length
      ? answered + " of " + QUESTIONS.length + " questions answered."
      : "All answered — submit when ready.";
  }

  /* ---------- Grading ---------- */
  function isCorrect(idx, sel) {
    var q = QUESTIONS[idx];
    if (!sel.length) return false;
    if (sel.length !== q.correct.length) return false;
    return q.correct.every(function (v) { return sel.indexOf(v) !== -1; });
  }

  function renderFeedback(idx, sel, ok) {
    var q  = QUESTIONS[idx];
    var fb = document.getElementById("fb-q" + idx);

    fb.innerHTML =
      '<p class="verdict ' + (ok ? "ok" : "bad") + '">' +
        (ok ? "&#10004; Correct" : "&#10008; Incorrect") +
      "</p>" +
      '<p><span class="lbl">Your answer:</span> ' + pretty(sel) + "</p>" +
      '<p><span class="lbl">Correct answer:</span> ' + pretty(q.correct) + "</p>" +
      '<p class="reason">' + q.reason + "</p>";

    fb.classList.add("show");

    inputsFor(idx).forEach(function (inp) {
      var lab = labelOf(inp);
      lab.classList.add("locked");
      var v = parseInt(inp.value, 10);
      if (q.correct.indexOf(v) !== -1) {
        lab.classList.add("is-correct");
      } else if (inp.checked) {
        lab.classList.add("is-wrong");
      }
    });

    var card = document.getElementById("card-q" + idx);
    card.classList.add(ok ? "correct" : "wrong");
  }

  function submitQuiz() {
    if (submitted) return;

    var results = [];
    QUESTIONS.forEach(function (q, idx) {
      var sel = selectionFor(idx);
      var ok  = isCorrect(idx, sel);
      results.push({ idx: idx, ok: ok });
      renderFeedback(idx, sel, ok);
      inputsFor(idx).forEach(function (i) { i.disabled = true; });
    });

    var score = results.filter(function (r) { return r.ok; }).length;

    scoreLine.innerHTML = "You scored <b>" + score + "</b> out of " + QUESTIONS.length +
      " &nbsp;&middot;&nbsp; " + (score === QUESTIONS.length ? "Perfect!" : "Review the explanations below.");

    chips.innerHTML = results.map(function (r) {
      return '<li class="chip ' + (r.ok ? "ok" : "bad") + '">' +
        "Q" + (r.idx + 1) + " " + (r.ok ? "&#10004;" : "&#10008;") +
      "</li>";
    }).join("");

    summary.classList.remove("hidden");
    summary.scrollIntoView({ behavior: "smooth", block: "start" });

    submitted = true;
    submitBtn.disabled = true;
    hint.textContent = "Submitted. Press Reset to try again.";
  }

  function resetQuiz() {
    submitted = false;
    form.reset();

    QUESTIONS.forEach(function (q, idx) {
      inputsFor(idx).forEach(function (inp) {
        inp.disabled = false;
        var lab = labelOf(inp);
        lab.classList.remove("is-correct", "is-wrong", "locked");
      });
      var fb = document.getElementById("fb-q" + idx);
      fb.innerHTML = "";
      fb.classList.remove("show");
      document.getElementById("card-q" + idx).classList.remove("correct", "wrong");
    });

    summary.classList.add("hidden");
    chips.innerHTML = "";
    scoreLine.innerHTML = "";
    refreshState();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---------- Init ---------- */
  buildQuiz();
  form.addEventListener("change", refreshState);
  submitBtn.addEventListener("click", submitQuiz);
  resetBtn.addEventListener("click", resetQuiz);
  refreshState();
})();
</script>

  <script src="timer.js"></script>
</body>
