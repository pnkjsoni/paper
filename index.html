<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patent Agent Examination — Paper I Practice (2023 – 2026)</title>
<style>
  :root{
    --bg:#f6f7fb; --surface:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e5e8f0;
    --brand:#4f46e5; --brand2:#7c3aed; --brand-soft:#eef2ff;
    --ok:#16a34a; --ok-bg:#ecfdf3; --ok-line:#86efac;
    --bad:#dc2626; --bad-bg:#fef2f2; --bad-line:#fca5a5;
    --sel-bg:#f3e8ff; --sel-line:#a855f7;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -12px rgba(15,23,42,.12);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1020; --surface:#131a2e; --text:#e6e9f5; --muted:#94a0bd; --line:#232c47;
      --brand:#818cf8; --brand2:#a78bfa; --brand-soft:#1b2347;
      --ok:#4ade80; --ok-bg:#0f2a1e; --ok-line:#1f6f45;
      --bad:#f87171; --bad-bg:#2d1519; --bad-line:#7f2a33;
      --sel-bg:#2a1b47; --sel-line:#8b5cf6;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
  header.top{position:relative;overflow:hidden;color:#fff;padding:44px 20px 70px;
    background:radial-gradient(900px 400px at 85% -20%,rgba(167,139,250,.55),transparent 60%),radial-gradient(700px 380px at 0% 120%,rgba(56,189,248,.35),transparent 60%),linear-gradient(135deg,#1e1b4b,#312e81 55%,#4338ca)}
  header.top .inner{max-width:900px;margin:0 auto;position:relative}
  .eyebrow{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:5px 12px;border-radius:999px;margin-bottom:14px;backdrop-filter:blur(6px)}
  header.top h1{margin:0 0 8px;font-size:clamp(26px,4.6vw,38px);line-height:1.15;letter-spacing:-.02em;font-weight:800}
  header.top p{margin:0 0 24px;font-size:15px;opacity:.82;max-width:620px}
  .tabs{display:inline-flex;gap:4px;padding:5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:14px;backdrop-filter:blur(8px);flex-wrap:wrap}
  .tab{font:inherit;font-size:14.5px;font-weight:700;padding:9px 24px;border-radius:10px;border:0;background:transparent;color:rgba(255,255,255,.85);cursor:pointer;transition:all .18s}
  .tab:hover{background:rgba(255,255,255,.14);color:#fff}
  .tab.active{background:#fff;color:#3730a3;box-shadow:0 4px 14px -4px rgba(0,0,0,.35)}
  .scorebar{position:sticky;top:10px;z-index:30;max-width:900px;margin:-34px auto 0;padding:0 16px}
  .scorebar .inner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px 14px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .pill{font-size:13px;font-weight:600;padding:6px 12px;border-radius:10px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
  .pill.green{background:var(--ok-bg);color:var(--ok)}
  .pill.red{background:var(--bad-bg);color:var(--bad)}
  .pill.gold{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
  .spacer{flex:1}
  button.reset{font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s}
  button.reset:hover{color:var(--text);border-color:var(--brand)}
  .progress{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--line)}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .35s ease}
  main{max-width:900px;margin:0 auto;padding:26px 16px 70px}
  h2.sechead{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--brand);margin:38px 0 14px}
  h2.sechead:first-child{margin-top:10px}
  h2.sechead::after{content:"";flex:1;height:1px;background:var(--line)}
  .qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;margin-bottom:16px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s}
  .qcard:hover{transform:translateY(-1px)}
  .qtitle{font-size:15.5px;font-weight:500;margin-bottom:14px;white-space:pre-line}
  .qnum{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 8px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:9px;font-size:13px;margin-right:10px;font-weight:800;vertical-align:1px}
  .multi{display:inline-block;font-size:12px;color:var(--brand2);background:var(--sel-bg);font-weight:700;margin:-4px 0 10px;padding:3px 10px;border-radius:999px}
  .opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:inherit;font-size:14.5px;line-height:1.5;cursor:pointer;transition:all .14s}
  .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft);transform:translateX(2px)}
  .opt:disabled{cursor:default}
  .opt b{flex:none;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:800;transition:all .14s}
  .opt.sel{background:var(--sel-bg);border-color:var(--sel-line)}
  .opt.sel b{background:var(--sel-line);color:#fff}
  .opt.correct{background:var(--ok-bg);border-color:var(--ok-line);color:var(--text);font-weight:600}
  .opt.correct b{background:var(--ok);color:#fff}
  .opt.correct::after{content:"✓";margin-left:auto;color:var(--ok);font-weight:800}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad-line);color:var(--text);font-weight:600}
  .opt.wrong b{background:var(--bad);color:#fff}
  .opt.wrong::after{content:"✕";margin-left:auto;color:var(--bad);font-weight:800}
  button.check{margin-top:8px;font:inherit;font-size:14px;font-weight:700;padding:10px 22px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;cursor:pointer;box-shadow:0 8px 18px -8px var(--brand);transition:transform .15s,opacity .15s}
  button.check:hover:not(:disabled){transform:translateY(-1px)}
  button.check:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:default}
  .free{margin-top:10px;font-size:12.5px;color:#92400e;background:#fef3c7;border-radius:10px;padding:8px 12px}
  @media (prefers-color-scheme: dark){.free{background:#3a2a0a;color:#fcd34d}}
  footer{max-width:900px;margin:0 auto;padding:0 16px 50px;font-size:12.5px;color:var(--muted);text-align:center}
  @media (max-width:560px){
    header.top{padding:32px 16px 62px}
    .tab{padding:8px 16px}
    .qcard{padding:18px 16px 14px;border-radius:16px}
    .scorebar{top:6px}
  }
</style>
</head>
<body>

<header class="top">
  <div class="inner">
    <span class="eyebrow">Paper I · Practice Bank</span>
    <h1>Patent Agent Examination</h1>
    <p>Pick a year to open that year's question paper. Click an option to check your answer instantly.</p>
    <div class="tabs" id="tabs"></div>
  </div>
</header>

<div class="scorebar">
  <div class="inner">
    <span class="pill">Attempted: <span id="attempted">0</span> / <span id="total">50</span></span>
    <span class="pill green">Correct: <span id="correct">0</span></span>
    <span class="pill red">Wrong: <span id="wrong">0</span></span>
    <span class="pill gold">Marks: <span id="marks">0</span> / <span id="maxmarks">100</span></span>
    <span class="spacer"></span>
    <button class="reset" id="resetBtn">↺ Reset year</button>
    <div class="progress"><i id="bar"></i></div>
  </div>
</div>

<main id="quiz"></main>
<footer id="foot"></footer>

<script>
/* ---------- helpers ---------- */
const S = (title, m) => ({ s: title, m });
const Q = (t, o, a, free) => ({ t, o, a, free: !!free });

const TF23 = ["Statement 1 is true, 2 is false","Statement 1 is false, 2 is true","Statement 1 and 2 both are false","Statement 1 and 2 both are true"];
const AR = ["When both (A) and (R) are true, and (R) is a correct explanation of (A)","When both (A) and (R) are true, but (R) is NOT a correct explanation of (A)","When (A) is true but (R) is false","When (A) is false but (R) is true"];
const AR24 = ["When Both (A) and (R) are True, and (R) is a correct Explanation of (A)","When Both (A) and (R) are True, but (R) is NOT a correct Explanation of (A)","When (A) is true but (R) is False","When (A) and (R) both are False"];
const TF = ["When Statement 1 is True, and Statement 2 is False","When Statement 1 is False, and Statement 2 is True","When Both Statements 1 and 2 are True","When Both Statements 1 and 2 are False"];

/* =====================================================================
   2023 — SET B
   ===================================================================== */
const Y2023 = [
S("Part A — Multiple Choice (2 marks each)", 2),
Q(`Sagar, who is an applicant of an invention, drafted the specification himself and filed the patent application, and asked his advocate who is not a patent agent to appear for the hearing. Is it allowed in accordance with the Patents Act?`,
 ["Sagar can draft the specification but only a patent agent can attend the hearing.","As Sagar has drafted and filed the application himself, only he himself can appear for hearing","Sagar can draft the specification and advocate is allowed to attend the hearing.","Only patent agent is allowed to draft the specification and attend the hearing proceedings."],"c"),
Q(`Students of Easwari Institute of Technology invented a new stabilizer, and designed a particular shape to make it attractive. They have given a name for that stabilizer as 'PASSION'. Further they made an operating manual for the operation of the stabilizer. They need IPR protection for the entire stabilizer. Could you please help them by matching exact legislation?

List 1                                    List 2
1. Invented stabilizer              (a) Copyright Act
2. Shape of stabilizer              (b) Trademark Act
3. PASSION                         (c) Patent Act
4. Operating manual              (d) Design Act`,
 ["1a, 2b, 3c, 4d","1c, 2d, 3b, 4a","1b, 2a, 3c, 4d","1c, 2d, 3a, 4b"],"b"),
Q(`Ms. Manisha wishes to file a patent application in India, but she came to know that some inventions are not patentable in accordance with the Indian Patents Act. Match List 1 and List 2 and select the correct code.

List 1                                                      List 2
1. Method of cultivating Rose flower      (a) Section 3(e)
2. Method of treating brain tumor           (b) Section 3(f)
3. Bucket fitted with torch                      (c) Section 3(h)
4. Solution of sugar and salt                  (d) Section 3(i)`,
 ["1d, 2c, 3a, 4b","1c, 2d, 3b, 4a","1a, 2b, 3c, 4d","1b, 2c, 3d, 4a"],"b"),
Q(`As part of the PCT procedure, an Indian applicant can receive an international search report and written opinion from –`,
 ["any International Searching Authority under the PCT","any International Searching Authority declared competent by the Receiving Office of India","the International Bureau of WIPO","Both (b) and (c)"],"b"),
Q(`PRINT INC. is a large corporation having a sizeable portfolio of patents for a single product. The product is very popular in the Indian market and some of the patents have been licensed to other companies. Choose the correct option regarding Form-27 –`,
 ["Form 27 should be filed by PRINT INC. but not by the licensees.","PRINT INC. can file a single Form 27 for multiple patents that are related to the said product.","The Form 27 should be filed before the expiry of a time period of 3 months counted from the end of the previous financial year in respect of which the form is being filed.","PRINT INC. cannot file a single Form 27 for multiple patents that are related to the said product."],"b"),
Q(`Your client, being a MNC, filed a patent application and paid all the fees applicable. Your client later on becomes uninterested in the patent application and wishes to seek refund. Please select the options available to your client –`,
 ["Your client can assign the application to a natural person and claim refund of 'the difference' in the scale of fees between the fees charged from your client and the fees chargeable from the natural person with regard to all the fees paid previously.","Your client can assign the application to a natural person and claim refund of 'the difference' in the scale of fees between the fees charged from your client and the fees chargeable from the natural person with regard to only the fees paid for request for examination.","Your client can make a request for withdrawal of patent application before the issuance of first statement of objection and claim a refund of 90% of fee paid for request for examination.","Your client can make a request for withdrawal of patent application before the issuance of first statement of objection and claim a refund of 50% of fee paid for request for examination."],"c"),
Q(`An inventor living in Shimla, Himachal Pradesh wants to file his patent application along with a demand draft for the amount of fee payable. Please select the correct options available to the inventor –`,
 ["The inventor may send his application by a courier company.","The inventor may send his application by speed post.","Both (a) and (b).","Only (a)."],"b"),
Q(`Your client, a startup which is facing existential challenges, filed a patent application 6 months ago which has not yet been published. Your client recently came to know that a competitor has started selling a product which is based on the invention disclosed in its patent application. The startup seeks your advice on the way forward. Please select the most prudent option(s) –`,
 ["Your client should file a request for expedited examination along with a request for early publication at the earliest.","Your client should send a legal notice to the competitor that he will have to pay the damages, calculated from the date of filing of patent application.","Your client should send a legal notice to the competitor that he will have to pay the damages, calculated from the date of grant of patent.","Your client should file a request for expedited examination, a request for early publication and a request to the Controller of Patents to stop the competitor from infringing his rights."],"a"),
Q(`A patent was granted within one year from the date of filing of patent application. The patentee will have to pay the renewal fee, without taking any extension:`,
 ["before the expiration of the 2nd year from the date of patent in respect of 3rd year;","before the expiration of the 1st year from the date of patent application in respect of 2nd year;","before the expiration of the 3rd year from the date of patent in respect of 3rd year;","None of the above."],"a"),
Q(`Marco files a patent application in Colombia on 09.01.2021 and thereafter, claiming priority from said application, he files a PCT International Application on 09.01.2022. Marco is interested to file a national phase patent application in India. The deadline to file in India would be:`,
 ["09.08.2023","09.01.2025","09.08.2024","09.07.2022"],"a"),
Q(`Nilesh filed a patent application on 24.03.2019 upon which a patent was granted. The fact of grant of patent was published in the Official Journal on 03.01.2022. Nilesh develops a further improvement of the said invention. Upon conducting a patent and non-patent literature search, Nilesh finds out that the 'improvement' is novel as compared to his own patent. However, the 'improvement' was disclosed in someone else's patent application which was published on 23.01.2022. Nilesh is in a position to file the application for patent of addition on 04.01.2023. What should Nilesh do?`,
 ["Nilesh should file an application for a patent of addition as the improvement is novel vis-à-vis his own patent.","Nilesh should not file an application for a patent of addition as his patent application would be devoid of novelty.","Nilesh should not file an application for a patent of addition as the same cannot be filed beyond the expiry of one year from the date of publication of grant of a patent.","None of the above."],"b"),
Q(`A post grant opposition is filed against the patent owned by the company Shelf Life Pvt. Ltd. The patentee does not desire to contest the opposition or leave his reply and evidence within the prescribed time limit. The patent shall be –`,
 ["deemed to have been abandoned","deemed to have been revoked","deemed to have been withdrawn","deemed to have been terminated"],"b"),
Q(`Your client PatBio wishes to file a patent application in the Indian patent office for an invention which uses a biological material from India. Arrange the following steps for protection of said invention in the most likely chronological order –
(1) filing of patent application
(2) deposition of biological material in recognized depository
(3) submitting permission from National Biodiversity Authority
(4) publication of patent application
(5) grant of patent`,
 ["1, 2, 3, 4, 5","2, 1, 4, 3, 5","2, 3, 1, 4, 5","1, 3, 2, 4, 5"],"b"),
Q(`Patent application filed by Rajesh is refused by the Controller and the said decision was communicated on 02/05/2023. Rajesh can file an application for the review of the Controller's decision by –`,
 ["02/08/2023","01/06/2023","01/11/2023","02/05/2024"],"b"),
Q(`Number of members in an opposition board is –`,
 ["2 including chairman","3 including chairman","4 including chairman","5 including chairman"],"b"),
Q(`James, a citizen of Norway –`,
 ["can file a patent application directly in India.","can file a patent application in India only after filing same in Norway.","can file a patent application in India only through PCT route.","can file application only in Norway and not in India."],"a"),
Q(`George Sebastian is a US citizen residing at Bangalore and working at a multinational company having offices throughout the world. As part of the research team, George invented a mosquito repellent. However, as per the Company policy, the application for patent should be first filed at the US Patent Office. George approached you for advice as to whether he has to do any formalities with the Indian Patent Office –`,
 ["As George is a US citizen and company is a multi-national one, there is no requirement from Indian Patent office side.","As George is residing at Bangalore, he has to obtain permission from Indian Patent office to file first application in US.","As George is residing at Bangalore, he has to obtain permission from US embassy in India to file first application in US.","As George is a US citizen, he has to obtain permission from Indian embassy in USA for filing first application in US."],"b"),
Q(`Three applicants applied for a patent and the patent was granted to them. Which of the following is true? (Note: there is no specific contract between them)`,
 ["all are having equal undivided share in patent.","first name holder in the Patent application will get major share.","sharing will be based on the alphabetical order.","sharing will be based on the date of birth."],"a"),
Q(`Mr. Suresh has two inventions related to a table top grinder. He filed patents for both inventions in the Indian Patent office. Patent was granted for one of the inventions and the other was pending. Mr. Suresh assigned all rights in both the cases to M/s Birdfly Industries. Now which forms are required to update the same in Patent Office records?`,
 ["Form 16 and Form 13","Form 16 and Form 6","Form 6 and Form 13","Two Form 13"],"b"),
Q(`An application for patent is open to public –`,
 ["Just after filing of application.","Just after publication of application.","Just after filing of pre-grant opposition in the application.","Just after FER is issued in the application."],"b"),
Q(`Mohan went to London, where he found a bicycle which works without a chain. He realized that this bicycle is not available in India and wishes to import this bicycle to India and to file a patent for it in India. He approaches you for your advice as per the Patents Act, 1970.`,
 ["Mohan can be considered as true and first inventor in India because this bicycle is not available in India.","Mohan can be considered as true and first inventor because he is the first person from India to know about this bicycle.","Mohan can be considered as true and first inventor if he is the first importer of the invention to India.","Mohan cannot be considered as true and first inventor."],"d"),
Q(`Styl & Co., a US company, was granted a patent for a sewing machine in the US. Joe is an entrepreneur engaged in manufacture and distribution of sewing machines in India. Joe came to know that Styl & Co. has not filed a patent application in India. In that case –`,
 ["Joe will get a patent in India.","Joe will get a patent in Europe.","Joe can freely manufacture the invention and sell it in India.","Joe cannot manufacture the invention in India."],"c"),
Q(`Mydhili invents a food processor that can chop vegetables and knead flour. Since the work was not complete, she first filed a provisional application on 20.01.2022. She filed complete specification for her invention on 15.04.2022. Later, she invented a fruit juicer unit that can be connected to the food processor. She applied for a patent of addition for the fruit juicer on 15.4.2023. Assuming that both patents will be granted, the patent term will expire on:`,
 ["20.01.2042 for both the patents.","15.4.2043 for both the patents.","15.04.2042 for the first and 15.04.2043 for the second patent.","20.01.2042 for the first and 15.04.2043 for the second patent."],"a"),
Q(`Gopal has filed a patent application along with necessary fees. But the application was not published. What could be the reason?`,
 ["Gopal did not file a request for Examination.","Gopal did not file a request for publication.","A pre-grant representation was filed against the application.","Gopal filed only a provisional specification."],"d"),
Q(`Gautham made a model of the speed boat which he invented. He files for a patent for the speed boat. Which of the following statements is correct?`,
 ["Model is part of complete specification and is to be filed at the time of filing of complete specification.","Model is not a part of the complete specification but it has to be filed along with the complete specification.","Model is not a part of the complete specification but has to be furnished if required by the Controller.","The Controller cannot ask for a model."],"c"),
Q(`Shiva was a great inventor for solar batteries and he filed five patent applications. Though the patents were granted for all the five inventions, Shiva died before the date of grant of patents due to sudden cardiac arrest. Shiva's only son Gana approached you for advice. Which section of the Patents Act will you refer to?`,
 ["Section 21","Section 44","Section 50","Section 53"],"b"),
Q(`Raju Gomaz, a US citizen, filed two applications with USPTO on 28.04.2017. He filed a convention application in India on 27.04.2018, claiming priority from one of the US applications. He filed a PCT international application on 25.04.2018 claiming priority from the other application and entered PCT national phase in India on 31.03.2019. The date of patent for the convention application and the national phase application are respectively:`,
 ["27.04.2018 and 25.04.2018","28.04.2017 and 31.03.2019","27.04.2018 and 31.03.2019","28.04.2017 and 28.04.2017"],"a"),
Q(`Your client who filed a PCT international application received the international search report from the International Searching Authority. In the search report, category code X is mentioned against a prior art document. Category code X means that when this document is taken alone, the claimed invention is:`,
 ["not novel but inventive","novel but not inventive","either not novel or not inventive","not industrially applicable"],"c"),
Q(`Dr. Karan got a patent for a surgical equipment. Dr. Vimala used that patented surgical equipment for research purpose. Dr. Karan issued a legal notice to Dr. Vimala for infringement. Dr. Vimala approached you for your advice. Which one of the following is correct?`,
 ["Dr. Vimala can use it freely for research.","Dr. Vimala can use it for research but has to pay royalty to Dr Karan.","Dr. Vimala can use it for research but has to take written permission from Dr Karan.","Dr. Vimala need not take permission from Dr Karan, but has to inform the Patent Office about it."],"a"),
Q(`Limera is a start-up in the field of space engineering. They have applied for patents and wish to get them granted at the earliest so that they can carry out their business.`,
 ["Limera should file request for early publication and request for expedited examination.","Limera being a startup is not eligible for expedited examination.","Limera need not file request for early publication and request for expedited examination as they are startup.","Limera should file request for early publication along with recommendation from ISRO."],"a"),

S("Part B — True / False Statements (1 mark each)", 1),
Q(`1. Time for putting an application in order for grant under section 21 shall be six months from the date of first statement of objection issued to the applicant.
2. Time for putting an application in order for grant may be further extended for a period of six months on a request of extension made in Form-4.`, TF23, "a"),
Q(`Company X is having place of business at US and filed initial application at USPTO and after six months from the US application, the company has done some modification and filed patent application for the same at Japan. Within 12 months from the date of US filing, Company X filed an Indian application claiming priority of earlier two applications from US and Japan.
1. Company X is allowed to claim priority of US application only.
2. Company X is allowed to claim both the priorities.`, TF23, "b"),
Q(`1. The term of every patent starts from the date of filing of the patent application.
2. No suit or other proceeding shall be commenced or prosecuted in respect of an infringement committed before the date of publication of the application.`, TF23, "d"),
Q(`Sandip has filed a patent application on 01/01/2019 for his invention missile tracking device and the application is considered to prejudice defence; subsequently on 25/12/2022 said secrecy direction is revoked.
1. The request for examination shall be made within forty eight months from the date of filing.
2. The request for examination shall be made within forty eight months from the date of revocation of secrecy direction.`, TF23, "a", true),
Q(`Gautami filed a patent application and wishes to get her application examined at the earliest –
1. She should file an expedited request for publication.
2. She should file an express request for examination.`, TF23, "c"),
Q(`1. The claims lack inventive step due to prior art disclosure in a single document combined with common general knowledge.
2. The claims lack inventive step due to combination of prior art disclosure in two or more citations.`, TF23, "d"),
Q(`In a case where an application processed by a startup is partly transferred to a multinational company –
1. The new applicant is not required to pay the difference in the scale of fees between the fees charged from a startup and the fees chargeable from multinational company.
2. The new applicant shall file a request for change in name of applicant.`, TF23, "b"),
Q(`While doing amendments in the specification –
1. Applicant shall provide a marked copy clearly identifying the amendments carried out.
2. Applicant shall provide a statement clearly indicating the portion of the specification or drawing being amended along with the reason shall be filed.`, TF23, "d"),
Q(`An application for patent is refused by the Controller. The applicant wishes to challenge the refusal.
1. Applicant can approach Intellectual Property Appellate Board.
2. Applicant can approach District Court.`, TF23, "c"),
Q(`1. Legal representative means a person who in law represents the estate of a deceased person.

Q("Statement I: An exclusive licensee of a patent is not eligible to challenge validity of the patent under section 64.\n\n Statement II: It would not be considered lawful for a patentee to insert a clause in the license agreement which restricts the rights of a licensee vis-à-vis patent validity.",
 ["Statement I is True, and Statement II is False","Statement I is False, and Statement II is True","Both Statements I and II are True","Both Statements I and II are False"], "b"),
Q("Statement I: An international search is carried out by an international searching authority, which may either be a national office or an intergovernmental organization.\n\n Statement II: The international searching authority carrying out the international search in respect of an international application shall not be competent to carry out a supplementary international search in respect of that application.",
 ["Statement I is True, and Statement II is False","Statement I is False, and Statement II is True","Both Statements I and II are True","Both Statements I and II are False"], "c"),
Q("Statement I: A dependent claim is found to be neither novel nor inventive in view of certain prior art. This will automatically mean that the independent claim, on which the dependent claim is based, is also not novel and not inventive.\n\n Statement II: A dependent claim may be novel and inventive even though the independent claim, on which the dependent claim is based, is found to be not novel and not inventive.",

S("Part C1 — Multiple Choice (3 marks each)", 3),
Q("A patent application X for a pharmaceutical compound is filed in India. An identical compound is also found to be claimed in two different applications in US (D1) and in India (D2). However, both of these applications were filed before the filing date of X, but published after the filing date of X. When considering anticipation, which of the following is/are true?\n\n I. The US application (D1) destroys novelty of X, but the Indian application (D2) doesn't destroy the novelty.\n\n II. The compound is novel, since the disclosure in the US and Indian applications are not considered as valid.\n\n III. The US application is valid for novelty if it was filed by the same inventor.\n\n IV. The US application (D1) doesn't destroy novelty of X, but the Indian application (D2) does destroy the novelty.",
 ["Only III is correct","Both II and III are correct","Only IV is correct","Both II and IV are correct"], "c"),
Q("In a patent application, claim 1 consists of features A, B, and C. Further, a dependent claim 2 (dependent on claim 1) consists of a feature D. Subsequently, another dependent claim 3 (dependent on claim 2) consists of feature E. You have a prior art D1 which discloses features A and B. Feature C is disclosed in document D2. Another document, D3, discloses features A, C, and E. Considering that all the prior arts D1–D3 are relevant to the concerned field of technology, choose the correct option(s):\n\n I. Documents D1 and D2 in combination destroy the inventive step of claim 1.\n\n II. Documents D1, D2 and D3 in combination destroy the inventive step of claim 3.\n\n III. Claim 2 and claim 3 are novel and inventive, while claim 1 is novel but not inventive in view of D1–D3.\n\n IV. Claims 2 and 3 cannot be considered inventive, as they are dependent on claim 1, which is not inventive in view of D1–D3.",
 ["Statements I, II, and III are correct","Statements I, II and IV are correct","Statements II, III, and IV are correct","Statements I and III are correct"], "d"),
Q("Dr. Asha and Dr. Mehra are co-patentees of three related patents granted for different aspects of the same medical device technology. One patent has been exclusively licensed to MedEquip Pvt. Ltd., and another has been non-exclusively licensed to BioHealth Ltd. All parties are commercially exploiting the inventions in India. Dr. Mehra is also the sole patentee of a separate patent on a biodegradable packaging technology, which is not yet being commercially worked, but she is interested in licensing it. Which of the above statements are correct?\n\n I. Dr. Asha, Dr. Mehra, MedEquip Pvt. Ltd., and BioHealth Ltd. are each required to file Form-27 individually for their respective patents or licenses.\n\n II. Dr. Asha and Dr. Mehra can file a single consolidated Form-27 for all three related patents, since they are co-owners and the patents relate to the same technology.\n\n III. Both MedEquip Pvt. Ltd. and BioHealth Ltd. can file their own Form-27 separately from the patentees for the patents they are licensed to use.\n\n IV. The revised Form-27 now includes a provision requiring patentees or licensees to state whether the patent is available for licensing.\n\n V. Form-27 is required to be filed only once during the lifetime of the patent, irrespective of whether it continues to be worked or not.",
 ["I, II, III and IV only","II, III, IV and V only","I, II and III only","All of the above"], "a"),
Q("Mr. Arjun is the patentee of Patent No. 123456 which relates to a new pharmaceutical composition. He requests surrender of his patent under Section 63 of the Act, which is duly published. One of the licensees, Ms. Meera, comes across this publication and feels that surrendering the patent would reduce her profits. In this situation, which of the following statements are correct under the Patents Act, 1970?\n\n I. Ms. Meera, being a person having an interest in the patent, may file a notice of opposition to the surrender within the prescribed period.\n\n II. The Controller must provide both Mr. Arjun and Ms. Meera an opportunity to be heard before deciding whether to accept the surrender.\n\n III. The patent stands automatically revoked upon Mr. Arjun's submission of the surrender notice.\n\n IV. The Controller may accept the patentee's request of surrender after hearing the patentee only.",
 ["I and II only","II and III only","I and IV only","All of the above"], "a"),
Q("With reference to sequence-listing fees under the Indian Patent Rules, consider the following statements:\n\n I. Natural persons, startups, and small entities are liable to pay a per-page sequence-listing fee subject to a maximum cap of X, irrespective of the number of pages.\n\n II. Large entities are liable to pay a per-page sequence-listing fee subject to a maximum cap of 5X.\n\n III. The sequence-listing fee is calculated strictly on a per-page basis without any upper monetary limit.\n\n IV. Filing the sequence listing in electronic form exempts the applicant from payment of any sequence-listing fee.\n\n V. The sequence-listing fee is determined with reference to the number of pages of the sequence listing.\n\n VI. The obligation to pay sequence-listing fees is independent of whether the biological material is deposited under the Budapest Treaty.\n\n Which of the above statements are correct?",
 ["I, II, V and VI only","I, II, III and V only","I, II, IV and VI only","II, III, V and VI only"], "a"),
S("Part C2 — Matching Questions (3 marks each)", 3),

 ["1-I, 2-II, 3-IV, 4-III, 5-V","1-I, 2-II, 3-III, 4-IV, 5-V","1-III, 2-I, 3-II, 4-IV, 5-V","1-II, 2-III, 3-I, 4-V, 5-IV"], "b"),
Q("Concerning the provisions of Compulsory Licensing (CL), match the following:\n\n Provision | Content\n 1. Section 84 | I. Request for revocation of a patent for which a CL was granted more than two years ago\n 2. Section 85 | II. CL when a reasonable requirement of the public is not met and the patented invention is not worked in India\n 3. Section 91 | III. CL extended to a second patent, without which working with the first CL is hindered or prevented\n 4. Section 92 | IV. CL for manufacture and export of a patented pharmaceutical product\n 5. Section 92A | V. CL by the Central Government in situations of national emergency or extreme urgency for public non-commercial use\n Choose the correct matching combination:",
 ["1-III, 2-I, 3-II, 4-IV, 5-V","1-II, 2-III, 3-I, 4-V, 5-IV","1-II, 2-I, 3-III, 4-V, 5-IV","1-I, 2-II, 3-III, 4-IV, 5-V"], "c"),
Q("Match the following Patent Forms with their respective purposes and statutory provisions under the Patents Act, 1970 and the Patents Rules, 2003:\n\n Form No. | Purpose | Relevant Section / Rule\n 1. Form 17 | (i) Application for a compulsory licence | (a) Sections 84(1), 91, 92(1) or 92A read with Rule 96\n 2. Form 19 | (ii) Request for revocation of a patent for non-working | (b) Section 85(1) read with Rule 96\n 3. Form 15 | (iii) Request for restoration of a lapsed patent | (c) Section 60(1) read with Rule 84\n 4. Form 21 | (iv) Request for termination of a compulsory licence | (d) Section 94 read with Rule 102(1)\n Choose the correct matching combination:",
 ["1-i-a, 2-ii-b, 3-iii-c, 4-iv-d","1-ii-b, 2-i-a, 3-iv-d, 4-iii-c","1-i-a, 2-iv-d, 3-iii-c, 4-ii-b","1-iii-c, 2-ii-b, 3-i-a, 4-iv-d"], "a"),
Q("Match the subject/principle of the case to the appropriate case citation:\n\n Column A (Case) | Column B (Subject / Principle)\n a. Natera Inc. & Anr. v. Assistant Controller of Patents & Designs | i. Section 3(d)\n b. DS BioPharma Limited v. The Controller of Patents and Designs | ii. Section 3(i)\n c. Immunas Pharma, Inc. v. Assistant Controller of Patents | iii. Patentability of products containing living microorganisms\n d. Dimminaco AG v. Controller | iv. Requirement under Sections 10(4) and 10(5) is mandatory\n e. VIFOR (International) Limited & Anr v. MSN Laboratories Pvt Ltd & Anr | v. Principles governing product-by-process claims\n f. The Regents of the University of California v. The Controller of Patents | vi. Section 3(c)",

Q("Match the following:\n\n Column I (Provision) | Column II (Definition)\n a. Section 2(1)(ta) | 1. \"patented article\" and \"patented process\" mean respectively an article or process in respect of which a patent is in force\n b. Section 2(1)(la) | 2. \"pharmaceutical substance\" means any new entity involving one or more inventive steps\n c. Section 2(1)(n) | 3. \"Opposition Board\" means an Opposition Board constituted under sub-section (4) of section 25\n d. Section 2(1)(o) | 4. \"patent agent\" means a person for the time being registered under this Act as a patent agent",
 ["a-1, b-2, c-3, d-4","a-3, b-4, c-1, d-2","a-4, b-1, c-2, d-3","a-2, b-3, c-4, d-1"], "d")

/* ---------- registry ---------- */
const YEARS = {
  "2023": { list: Y2023, note: "2023 paper: Set B, with the official answer key. Part C has more than one correct option — select all that apply, then press “Check answer”. Full marks were awarded to all candidates for Q34 (Set B), so it is counted as correct." },
  "2024": { list: Y2024, note: "2024 paper: Set C, with the official answer key (Paper 1)." },
  "2025": { list: Y2025, note: "2025 paper: Set A, with the official answer key. Q29 and Q30 share one scenario (the cradle claims)." },
  "2026": { list: Y2026, note: "2026 paper: combined practice bank of unique questions from Sets A–D, with the answer keys supplied (Set A ordering followed where sets repeated a question). Q1 shows pictures in the paper; they are described in words here." }
};

/* ---------- build flat question arrays ---------- */
const BANK = {};
Object.keys(YEARS).forEach(y => {
  let sec = null, n = 0; const flat = [];
  YEARS[y].list.forEach(it => {
    if (it.s) { sec = it; return; }
    n++;
    flat.push({ n, sec: sec.s, m: sec.m, t: it.t, o: it.o, free: it.free,
      a: it.a.split(',').map(x => 'abcd'.indexOf(x.trim())) });
  });
  BANK[y] = flat;
});

/* ---------- state ---------- */
const STATE = {};
Object.keys(BANK).forEach(y => STATE[y] = { res: {}, draft: {} });
let year = "2023";

const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function cardHTML(y, i) {
  const q = BANK[y][i], st = STATE[y];
  const r = st.res[i], multi = q.a.length > 1;
  const draft = st.draft[i] || [];
  let h = `<div class="qcard" data-i="${i}"><div class="qtitle"><span class="qnum">${q.n}</span>${esc(q.t)}</div>`;
  if (multi && !r) h += `<div class="multi">More than one option is correct — select all that apply.</div>`;
  q.o.forEach((opt, oi) => {
    let cls = 'opt';
    if (r) {
      if (q.a.includes(oi)) cls += ' correct';
      else if (r.chosen.includes(oi)) cls += ' wrong';
    } else if (draft.includes(oi)) cls += ' sel';
    h += `<button class="${cls}" data-i="${i}" data-o="${oi}" ${r ? 'disabled' : ''}><b>${'ABCD'[oi]}.</b> ${esc(opt)}</button>`;
  });
  if (multi && !r) h += `<button class="check" data-i="${i}" ${draft.length ? '' : 'disabled'}>Check answer</button>`;
  if (r && q.free) h += `<div class="free">Note: full marks were awarded to all candidates for this question.</div>`;
  return h + `</div>`;
}

function renderYear() {
  const flat = BANK[year];
  let h = '', last = '';
  flat.forEach((q, i) => {
    if (q.sec !== last) { last = q.sec; h += `<h2 class="sechead">${esc(q.sec)}</h2>`; }
    h += cardHTML(year, i);
  });
  $('quiz').innerHTML = h;
  $('foot').textContent = YEARS[year].note;
  updateScore();
}

function updateScore() {
  const flat = BANK[year], st = STATE[year];
  let c = 0, w = 0, marks = 0, max = 0;
  flat.forEach((q, i) => {
    max += q.m;
    const r = st.res[i];
    if (!r) return;
    if (r.ok) { c++; marks += q.m; } else w++;
  });
  $('attempted').textContent = c + w;
  $('total').textContent = flat.length;
  $('correct').textContent = c;
  $('wrong').textContent = w;
  $('marks').textContent = marks;
  $('maxmarks').textContent = max;
  $('bar').style.width = (flat.length ? (c + w) / flat.length * 100 : 0) + '%';
}

function refreshCard(i) {
  const old = document.querySelector(`.qcard[data-i="${i}"]`);
  const tmp = document.createElement('div');
  tmp.innerHTML = cardHTML(year, i);
  old.replaceWith(tmp.firstChild);
}

function evaluate(i, chosen) {
  const q = BANK[year][i];
  const ok = q.free || (chosen.length === q.a.length && q.a.every(x => chosen.includes(x)));
  STATE[year].res[i] = { chosen, ok };
  refreshCard(i);
  updateScore();
}

$('quiz').addEventListener('click', e => {
  const chk = e.target.closest('.check');
  if (chk) {
    const i = +chk.dataset.i;
    evaluate(i, STATE[year].draft[i] || []);
    return;
  }
  const btn = e.target.closest('.opt');
  if (!btn || btn.disabled) return;
  const i = +btn.dataset.i, o = +btn.dataset.o;
  const q = BANK[year][i];
  if (q.a.length > 1) {
    const d = STATE[year].draft[i] || [];
    const k = d.indexOf(o);
    if (k >= 0) d.splice(k, 1); else d.push(o);
    STATE[year].draft[i] = d;
    refreshCard(i);
  } else {
    evaluate(i, [o]);
  }
});

$('resetBtn').addEventListener('click', () => {
  STATE[year] = { res: {}, draft: {} };
  renderYear();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

function buildTabs() {
  $('tabs').innerHTML = Object.keys(YEARS).map(y =>
    `<button class="tab ${y === year ? 'active' : ''}" data-y="${y}">${y}</button>`).join('');
}
$('tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t) return;
  year = t.dataset.y;
  buildTabs();
  renderYear();
  window.scrollTo({ top: 0 });
});

buildTabs();
renderYear();
</script>
</body>
</html>
