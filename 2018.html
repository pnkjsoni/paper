<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patent Agent Examination — Paper I Practice (2018)</title>
<style>
  :root{
    --bg:#f6f7fb; --surface:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e5e8f0;
    --brand:#4f46e5; --brand2:#7c3aed; --brand-soft:#eef2ff;
    --ok:#16a34a; --ok-bg:#ecfdf3; --ok-line:#86efac;
    --bad:#dc2626; --bad-bg:#fef2f2; --bad-line:#fca5a5;
    --sel-bg:#f3e8ff; --sel-line:#a855f7;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -12px rgba(15,23,42,.12);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1020; --surface:#131a2e; --text:#e6e9f5; --muted:#94a0bd; --line:#232c47;
      --brand:#818cf8; --brand2:#a78bfa; --brand-soft:#1b2347;
      --ok:#4ade80; --ok-bg:#0f2a1e; --ok-line:#1f6f45;
      --bad:#f87171; --bad-bg:#2d1519; --bad-line:#7f2a33;
      --sel-bg:#2a1b47; --sel-line:#8b5cf6;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
  header.top{position:relative;overflow:hidden;color:#fff;padding:44px 20px 70px;
    background:radial-gradient(900px 400px at 85% -20%,rgba(167,139,250,.55),transparent 60%),radial-gradient(700px 380px at 0% 120%,rgba(56,189,248,.35),transparent 60%),linear-gradient(135deg,#1e1b4b,#312e81 55%,#4338ca)}
  header.top .inner{max-width:900px;margin:0 auto;position:relative}
  .eyebrow{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:5px 12px;border-radius:999px;margin-bottom:14px;backdrop-filter:blur(6px)}
  header.top h1{margin:0 0 8px;font-size:clamp(26px,4.6vw,38px);line-height:1.15;letter-spacing:-.02em;font-weight:800}
  header.top p{margin:0 0 24px;font-size:15px;opacity:.82;max-width:620px}
  .tabs{display:inline-flex;gap:4px;padding:5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:14px;backdrop-filter:blur(8px);flex-wrap:wrap}
  .tab{font:inherit;font-size:14.5px;font-weight:700;padding:9px 24px;border-radius:10px;border:0;background:transparent;color:rgba(255,255,255,.85);cursor:pointer;transition:all .18s}
  .tab:hover{background:rgba(255,255,255,.14);color:#fff}
  .tab.active{background:#fff;color:#3730a3;box-shadow:0 4px 14px -4px rgba(0,0,0,.35)}
  .scorebar{position:sticky;top:10px;z-index:30;max-width:900px;margin:-34px auto 0;padding:0 16px}
  .scorebar .inner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px 14px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .pill{font-size:13px;font-weight:600;padding:6px 12px;border-radius:10px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
  .pill.green{background:var(--ok-bg);color:var(--ok)}
  .pill.red{background:var(--bad-bg);color:var(--bad)}
  .pill.gold{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
  .spacer{flex:1}
  button.reset{font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s}
  button.reset:hover{color:var(--text);border-color:var(--brand)}
  .progress{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--line)}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .35s ease}
  main{max-width:900px;margin:0 auto;padding:26px 16px 70px}
  h2.sechead{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--brand);margin:38px 0 14px}
  h2.sechead:first-child{margin-top:10px}
  h2.sechead::after{content:"";flex:1;height:1px;background:var(--line)}
  .qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;margin-bottom:16px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s}
  .qcard:hover{transform:translateY(-1px)}
  .qtitle{font-size:15.5px;font-weight:500;margin-bottom:14px;white-space:pre-line}
  .qnum{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 8px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:9px;font-size:13px;margin-right:10px;font-weight:800;vertical-align:1px}
  .multi{display:inline-block;font-size:12px;color:var(--brand2);background:var(--sel-bg);font-weight:700;margin:-4px 0 10px;padding:3px 10px;border-radius:999px}
  .opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:inherit;font-size:14.5px;line-height:1.5;cursor:pointer;transition:all .14s}
  .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft);transform:translateX(2px)}
  .opt:disabled{cursor:default}
  .opt b{flex:none;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:800;transition:all .14s}
  .opt.sel{background:var(--sel-bg);border-color:var(--sel-line)}
  .opt.sel b{background:var(--sel-line);color:#fff}
  .opt.correct{background:var(--ok-bg);border-color:var(--ok-line);color:var(--text);font-weight:600}
  .opt.correct b{background:var(--ok);color:#fff}
  .opt.correct::after{content:"✓";margin-left:auto;color:var(--ok);font-weight:800}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad-line);color:var(--text);font-weight:600}
  .opt.wrong b{background:var(--bad);color:#fff}
  .opt.wrong::after{content:"✕";margin-left:auto;color:var(--bad);font-weight:800}
  button.check{margin-top:8px;font:inherit;font-size:14px;font-weight:700;padding:10px 22px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;cursor:pointer;box-shadow:0 8px 18px -8px var(--brand);transition:transform .15s,opacity .15s}
  button.check:hover:not(:disabled){transform:translateY(-1px)}
  button.check:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:default}
  .free{margin-top:10px;font-size:12.5px;color:#92400e;background:#fef3c7;border-radius:10px;padding:8px 12px}
  @media (prefers-color-scheme: dark){.free{background:#3a2a0a;color:#fcd34d}}
  footer{max-width:900px;margin:0 auto;padding:0 16px 50px;font-size:12.5px;color:var(--muted);text-align:center}
  @media (max-width:560px){
    header.top{padding:32px 16px 62px}
    .tab{padding:8px 16px}
    .qcard{padding:18px 16px 14px;border-radius:16px}
    .scorebar{top:6px}
  }
</style>
</head>

<header class="top">
  <div class="inner">
    <span class="eyebrow">Paper I · 2018 Practice Bank</span>
    <h1>Patent Agent Examination — 2018</h1>
    <p>Click an option to check your answer instantly. Part C questions have more than one correct option — select all that apply, then press “Check answer”.</p>
    <div class="tabs" id="tabs"></div>
  </div>
</header>

<div class="scorebar">
  <div class="inner">
    <span class="pill">Attempted: <span id="attempted">0</span> / <span id="total">50</span></span>
    <span class="pill green">Correct: <span id="correct">0</span></span>
    <span class="pill red">Wrong: <span id="wrong">0</span></span>
    <span class="pill gold">Marks: <span id="marks">0</span> / <span id="maxmarks">100</span></span>
    <span class="spacer"></span>
    <button class="reset" id="resetBtn">↺ Reset year</button>
    <div class="progress"><i id="bar"></i></div>
  </div>
</div>

<main id="quiz"></main>
<footer id="foot"></footer>

<script>
/* ---------- helpers ---------- */
const S = (title, m) => ({ s: title, m });
const Q = (t, o, a, free) => ({ t, o, a, free: !!free });

const TF18 = [
  "Statement 1 is true, 2 is false",
  "Statement 1 is false, 2 is true",
  "Statement 1 and 2 both are false",
  "Statement 1 and 2 both are true"
];

/* =====================================================================
   2018 — PAPER I
   ===================================================================== */
const Y2018 = [
S("Part A — Multiple Choice (2 marks each)", 2),

Q(`The Central Government may, if satisfied that it is necessary that a patent should be acquired from the patentee for a public purpose within the provisions of the Patents Act, then a notification is published in:`,
["All leading newspapers","All leading newspapers and journals","Official Gazette","All of the above"],"c"),

Q(`Choose the correct option from the following:

Every application for a patent shall be published under section 11A of the Act except in cases where the application —`,
[
"in which a secrecy direction is imposed under section 35 of the Act",
"has been abandoned under sub-section (1) of section 9 of the Act",
"has been withdrawn three months prior to the period specified under sub-section (1) of section 11A of the Act",
"All of the above"
],"d"),

Q(`In case of a request for permission for making a patent application outside India as per section 39 of the Act, the time frame to dispose of such request by the Controller is:`,
["Within 30 days from the request","Within 6 months from the request","Within 21 days from the request","None of the above"],"c"),

Q(`A patent awarded by the Patent Office of India is valid in:`,
["All ASEAN countries' territories","All countries that adhere to TRIPS","Indian territory","All of the above"],"c"),

Q(`One PCT application with US priority is filed on 19.09.2009 and for filing the National Phase application in India the applicant needs to file within:`,
["19.04.2012","19.09.2014","19.09.2013","19.04.2013"],"a"),

Q(`A patent applicant may file a patent infringement suit within the provisions of the Act only after:`,
["Publication of the patent application","Grant of the patent application","Priority date of the patent application","Date of filing of the complete specification"],"b"),

Q(`As per the Patents Act, 1970, the first compulsory licence granted in India was to:`,
["Natco Pharma on 9th March, 2012","Cipla on 9th March, 2009","Glenmark on 27th January, 2009","None of the above"],"a"),

Q(`Method of committing theft is not patentable in accordance with one of the sections of the Patents Act, 1970. Find out the relevant section from the following:`,
["Section 3(c) of the Act","Section 3(b) of the Act","Section 3(a) of the Act","Section 3(d) of the Act"],"b"),

Q(`As per the Patents Act, the term of a patent of addition filed on 13.04.2012 (granted on 15.01.2015) with regard to the complete specification of an ordinary patent application filed on 15.07.2008 (granted on 17.09.2011) is up to [considering that neither one is revoked prior to the term of validity]:`,
["13.04.2032","15.07.2028","17.09.2031","15.01.2035"],"b"),

Q(`An appeal shall not lie to the Appellate Board as per the Patents Act for the following option:`,
[
"Refusal decision of a patent application under section 15 of the Act",
"An application is deemed to be abandoned under section 21 of the Act",
"Decision of the Controller with regard to compulsory licence under section 84 of the Act",
"The decision related to post-grant opposition under section 25(4) of the Act"
],"b"),

Q(`The period for which an application for patent shall not ordinarily be open to the public in the Patent Office Journal from the date of filing or the date of priority of the application, whichever is earlier, as per the provisions of the Act (assume there is no request for early publication):`,
["18 months","12 months","6 months","8 months"],"a"),

Q(`An Indian applicant has filed an ordinary patent application before the Patent Office by filing a provisional specification on 12.05.2011 (assuming no post-dating of the application). Find out the correct option from the following:`,
[
"The applicant filed the complete specification on 12.8.2012 after filing Form 4 on 11.05.2012 for three months' extension",
"The applicant filed the complete specification on 12.05.2012",
"The applicant filed a petition under Rule 138 of the prevailing Rules and submitted the complete specification on 12.06.2012",
"None of the above"
],"b"),

Q(`As per the Patents Act, the qualification required for a registered patent agent to work as the Technical Member of the Appellate Board is:`,
[
"Master's degree in Science with at least 8 years functioned as a registered patent agent",
"Degree in Engineering or Technology or Master's degree in Science with at least 10 years functioned as a registered patent agent",
"Bachelor's degree in Engineering or Technology or Science with a law degree",
"All of the above"
],"b"),

Q(`As per the Patents Act, the Register of Patents shall contain:`,
[
"Names and addresses of grantees of patents",
"Revocations of patents",
"Notification of assignments and of transmissions of patents",
"All of the above"
],"d"),

Q(`Any person interested may make an application to the Controller for granting a compulsory licence on a patent as per the Patents Act, on the following grounds:`,
[
"That the patented invention is not available to the public at a reasonably affordable price",
"That the patented invention is reserved for non-commercial purpose",
"That the patented invention is imported with immediate effect",
"None of the above"
],"a"),

Q(`A researcher finds an idea on recycling of biodegradable plastic. How does he proceed for patenting his idea?`,
[
"He needs to publish in a scientific journal and has to wait for an invitation from the Patent Office",
"He needs to submit a provisional specification and subsequently file a complete specification before the Patent Office",
"Both A and B",
"None of the above"
],"b"),

Q(`The 'invention' as per the Patents Act, 1970 incorporates:`,
["Capable of industrial application","An inventive step","A new product or process","All of the above"],"d"),

Q(`Identify from the following patented products for which compulsory licences are available for export, which is entitled for manufacture and export to any country having insufficient / no manufacturing capacity to address public health problems, as per the Patents Act:`,
["Disaster management related device","Pharmaceutical products","Food products","All of the above"],"b"),

Q(`When a patent completes its full term of 20 years within the provisions of the Patents Act, it:`,
["May be renewed for a further period of 10 years","May be renewed only under special circumstances","May be renewed for a period of 5 years","Shall not be renewed"],"d"),

Q(`A ceased patent due to non-payment of renewal fees may be restored by filing an application for restoration with the prescribed fee as per the Patents Act:`,
[
"Within 12 months from the date on which the patent ceased to have effect",
"Within 18 months from the date on which the patent ceased to have effect",
"Within 48 months from the date on which the patent ceased to have effect",
"None of the above"
],"b"),

Q(`The submission of proof of right to make an application for a patent made by virtue of an assignment as per the Act shall be within a prescribed period of:`,
[
"With the application or within 3 months from the date of application",
"With the application or 9 months from the date of application",
"With the application or 6 months from the date of application",
"With the application or 12 months from the date of application"
],"a"),

Q(`Find out from the following which is NOT a ground for opposition under Section 25(1) of the Patents Act, 1970:`,
[
"That the request for examination pursuant to the filing of the complete specification has not been filed by the applicant himself",
"That the complete specification does not sufficiently and clearly describe the invention or the method by which it is to be performed",
"That the applicant has failed to disclose to the Controller the information required by section 8 or has furnished information which in any material particular was false to his knowledge",
"That the patentee or the person under or through whom he claims wrongfully obtained the invention or any part thereof from him or from a person under or through whom he claims"
],"a"),

Q(`International application as per the Patents Act, 1970 means:`,
[
"An application filed in WTO",
"An application filed under the Hague Agreement",
"An application for patent made in accordance with the Patent Cooperation Treaty",
"An application for patent made in accordance with the Budapest Treaty"
],"c"),

Q(`Discovery of a new galaxy is not patentable:`,
[
"As per section 3(c) of the Patents Act, 1970",
"As per section 3(k) of the Patents Act, 1970",
"As per section 3(d) of the Patents Act, 1970",
"As per section 3(b) of the Patents Act, 1970"
],"a"),

Q(`Definition of "capable of industrial application", in relation to an invention as per the Patents Act, means:`,
[
"That the invention is capable of being made or used in an industry",
"That the invention is capable of being manufactured in an industry",
"That the invention is capable of being sold by an industry",
"None of the above"
],"a"),

Q(`An appeal may be filed against a decision of the Controller as per the Patents Act before:`,
["High Court","IPAB","District Court","All of the above"],"b"),

Q(`Three applicants applied for a patent in India and the patent is granted to them, and now there is doubt amongst them regarding their patent rights. As a patent agent, what will be your clarification to your clients? (Note: they are not bound by any contract.)`,
[
"All are having an equal undivided share in the patent",
"First name holder in the patent application shall get a major share",
"Sharing shall be based on alphabetical order",
"Sharing shall be based on date of birth"
],"a"),

Q(`A patent shall be deemed to be revoked in public interest by the Central Government:`,
[
"After appealing in the IPAB against the patentee and notification in the newspaper",
"After serving a notice to the patentee and notification in the newspaper",
"After hearing the patentee and making a declaration to that effect in the Official Gazette",
"None of the above"
],"c"),

Q(`If an article sold by a manufacturer is engraved with the word "Patent" falsely, then he shall be punishable for such venture within the provisions of the Patents Act by:`,
[
"Imprisonment for 2 years",
"Fine, which may extend to Rupees 1 lakh",
"Imprisonment of one year and fine of Rupees 50 thousand",
"All of the above"
],"b"),

Q(`An applicant has filed an international application on 05.07.2012 based on a provisional application in India on 08.08.2011, and again filed a National Phase application in India on 10.09.2013. If the said National Phase application is granted on 24.06.2016, then the term of the said patent application shall be up to [considering that the patent is not revoked prior to the term of validity]:`,
["05.07.2032","08.08.2031","24.06.2036","None of the above"],"a"),

S("Part B — True / False Statements (1 mark each)", 1),

Q(`Amendment of an application for a patent or a complete specification or any document relating thereto, at any time either before or after grant of the patent as per the provisions of the Patents Act, 1970:
1. Shall be made by way of disclaimer, correction or explanation and incorporation of actual fact.
2. Shall be allowed though it describes matter not in substance disclosed or shown in the specification before the amendment.`, TF18, "a"),

Q(`1. Mr. Rao is a researcher from a reputed institute in Bangalore and has filed an ordinary patent application before the Patent Office, though he has published the same subject matter in an international journal 5 years before the filing date of the above-mentioned patent application, as he is confident that — the author of the journal and the patent applicant being the same — his application shall not be refused within the provisions of the Patents Act.
2. Mr. Rao is a researcher at a reputed institute in Bangalore and has filed an ordinary patent application before the Patent Office, though he has published the same subject matter in an international journal after the filing date of the above-mentioned patent application, as he is confident that — the author of the journal and the patent applicant being the same — his application shall not be refused within the provisions of the Patents Act.`, TF18, "b"),

Q(`1. An application to the Controller for review of his own decision as per the Patents Act, within the provisions of the prevailing Patent Rules, shall be made in Form 24 within one month from the date of communication of such decision to the applicant, or within such further period not exceeding one month thereafter as the Controller may allow on a request made in Form 4 stating all the grounds on which review is sought.
2. An application to the Controller for review of his own decision as per the Patents Act, within the provisions of the prevailing Patent Rules, shall be made in Form 24 within six months from the date of communication of such decision to the applicant, or within such further period not exceeding one month thereafter as the Controller may allow on a request made in Form 4 stating all the grounds on which review is sought.`, TF18, "a"),

Q(`Company X has its place of business in the US and filed an initial application at the USPTO; after six months from the US application, the company made some modification and filed another application at the USPTO. Within 12 months from the date of the first US filing, Company X filed an Indian application claiming priority from the earlier two US applications:
1. Company X is allowed only to claim priority pertaining to the earlier application, and therefore the Controller refused it.
2. Company X is allowed to claim both the priorities, and the priority date of the application is the date on which it was first disclosed.`, TF18, "b"),

Q(`As per the Act, the claim or claims of a complete specification shall:
1. Relate to a single invention.
2. Relate to a group of inventions linked so as to form a single inventive concept.`, TF18, "d"),

Q(`For any proceedings before the Controller as per the Patents Act, 1970, he shall have the powers of a civil court while trying a suit under the Code of Civil Procedure, 1908 in respect of the following matters:
1. Summoning of any person and receiving evidence on affidavits.
2. Power for setting aside an order passed ex parte on application made within the prescribed time and in the prescribed manner.`, TF18, "a"),

Q(`1. Applicants X and Y file a patent application jointly before the Indian Patent Office. The application shall be examined on filing a "Request for Examination" within the prescribed time as per the provisions of the Act by either X or Y.
2. Applicants X and Y file a patent application jointly before the Indian Patent Office. The application shall be examined on filing a "Request for Examination" within the prescribed time as per the provisions of the Act by any other interested person Z.`, TF18, "d"),

Q(`1. As per the Patents Act, 1970, if the applicant mentions a biological material in the specification and if such material is not available to the public, then the application shall be completed by depositing the material with an International Depositary Authority under the Budapest Treaty not later than the date of filing the patent application in India, and a reference thereto shall be made in the specification within three months from the date of filing of the application.
2. As per the Patents Act, 1970, if the applicant mentions a biological material in the specification and it is not available to the public, then he does not have to deposit the biological material with any International Depositary Authority under the Budapest Treaty during the proceedings of the patent application.`, TF18, "a"),

Q(`1. As per the provisions of the Patents Act, 1970, a patentee may, at any time after grant, offer to surrender his patent.
2. As per the provisions of the Patents Act, 1970, a patentee may offer to surrender his patent only after three years from the date of grant of the patent.`, TF18, "a"),

Q(`1. As per the provisions of the Patents Act, a patent of addition shall be granted before the date of grant of the patent for the main invention.
2. As per the provisions of the Patents Act, the patent of addition shall not be refused on the ground only that the invention claimed in the complete specification does not involve any inventive step having regard to any publication or use of the main invention described in the complete specification relating thereto.`, TF18, "b"),

S("Part C — Multiple Correct Answers (3 marks each; at least two options correct)", 3),

Q(`A national or regional patent office grants a patent. The following regional patent offices operative at present is/are:`,
["ARIPO","WIPO","EPO","EAPO"],"a,c,d"),

Q(`If any non-registered patent agent practises before the Patent Office, he shall be punishable within the provisions of the Patents Act:`,
[
"With a fine of 3 lakh rupees for the first offence and 6 lakh rupees in case of a second offence",
"With one lakh rupees only for each offence",
"With one lakh rupees for the first offence",
"With five lakh rupees for the second or subsequent offence"
],"c,d"),

Q(`India is a member of the following international treaty/treaties:`,
["PCT","Paris Convention","Both A and B","Not a member of any international treaty"],"c"),

Q(`An applicant has received a direction from the Controller under section 16 of the Patents Act. Find out the correct option(s) of further acts by the applicant:`,
[
"He may file a divisional application before grant",
"He may ask for an oral hearing to convince the Controller that the invention comes under a single inventive concept",
"He may forego the second invention",
"He may file a divisional application for the second invention after the grant of the first one"
],"a,b,c"),

Q(`An application for a patent for an invention may be made by:`,
[
"True and first inventor",
"Assignee of the true and first inventor",
"Legal representative of the true and first inventor",
"None of the above"
],"a,b,c"),

Q(`Which of the following sections are appealable against the decision, order or direction of the Controller under the provisions of the Act:`,
[
"Sections 15 and 16 of the Act",
"Section 21 of the Act",
"Sections 54, 57 and 60 of the Act",
"Sections 17, 18 and 19 of the Act"
],"a,c,d"),

Q(`Which of the following is/are not patentable as per the provisions of the Patents Act:`,
[
"A surgical instrument",
"A computer program per se",
"Discovery of any living thing",
"A clock having 10 hours and each hour divided into 100 minutes"
],"b,c"),

Q(`There are various modes for the revocation of a patent within the provisions of the Patents Act. They are classified as follows. Find out the correct option(s):`,
[
"Revocation by the Appellate Board",
"Revocation by the District Court",
"Revocation by the Controller",
"Revocation by the Central Government"
],"a,c,d"),

Q(`Applicant 'A' has been granted a patent as per the Patents Act. The exclusive rights would be conferred upon 'A' to prevent third parties who do not have his consent:`,
["from making","from selling","from importing","None of the above"],"a,b,c"),

Q(`One patent of a reputed company D in the steel industry has ceased due to non-payment of renewal fees, and D has applied for restoration with the prescribed fee and reasons thereof. Suddenly another company of the same industry opposes the request for restoration of D on the following grounds. Find out the appropriate grounds from the following:`,
[
"That the patented invention is not worked in the territory of India",
"That the failure to pay the renewal fee was not unintentional",
"That the patented invention is not available to the public at a reasonable price",
"That there has been undue delay in making the application"
],"b,d")
];

/* ---------- registry ---------- */
const YEARS = {
  "2018": {
    list: Y2018,
    note: "2018 Paper I practice bank. The supplied 2018 answer-key PDF contained only unreadable binary output, so the answers here are worked out from the Patents Act, 1970 and the Patents Rules, 2003 as applicable to the 2018 paper — please verify against the official key before relying on them. Part C questions have more than one correct option (Q43 has a single combined option) — select all that apply, then press “Check answer”."
  }
};

/* ---------- build flat question arrays ---------- */
const BANK = {};
Object.keys(YEARS).forEach(y => {
  let sec = null, n = 0; const flat = [];
  YEARS[y].list.forEach(it => {
    if (it.s) { sec = it; return; }
    n++;
    flat.push({
      n,
      sec: sec.s,
      m: sec.m,
      t: it.t,
      o: it.o,
      free: it.free,
      a: it.a.split(',').map(x => 'abcd'.indexOf(x.trim()))
    });
  });
  BANK[y] = flat;
});

/* ---------- state ---------- */
const STATE = {};
Object.keys(BANK).forEach(y => STATE[y] = { res: {}, draft: {} });
let year = "2018";

const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function cardHTML(y, i) {
  const q = BANK[y][i], st = STATE[y];
  const r = st.res[i], multi = q.a.length > 1;
  const draft = st.draft[i] || [];
  let h = `<div class="qcard" data-i="${i}"><div class="qtitle"><span class="qnum">${q.n}</span>${esc(q.t)}</div>`;
  if (multi && !r) h += `<div class="multi">More than one option is correct — select all that apply.</div>`;
  q.o.forEach((opt, oi) => {
    let cls = 'opt';
    if (r) {
      if (q.a.includes(oi)) cls += ' correct';
      else if (r.chosen.includes(oi)) cls += ' wrong';
    } else if (draft.includes(oi)) cls += ' sel';
    h += `<button class="${cls}" data-i="${i}" data-o="${oi}" ${r ? 'disabled' : ''}><b>${'ABCD'[oi]}.</b> ${esc(opt)}</button>`;
  });
  if (multi && !r) h += `<button class="check" data-i="${i}" ${draft.length ? '' : 'disabled'}>Check answer</button>`;
  if (r && q.free) h += `<div class="free">Note: full marks were awarded to all candidates for this question.</div>`;
  return h + `</div>`;
}

function renderYear() {
  const flat = BANK[year];
  let h = '', last = '';
  flat.forEach((q, i) => {
    if (q.sec !== last) { last = q.sec; h += `<h2 class="sechead">${esc(q.sec)}</h2>`; }
    h += cardHTML(year, i);
  });
  $('quiz').innerHTML = h;
  $('foot').textContent = YEARS[year].note;
  updateScore();
}

function updateScore() {
  const flat = BANK[year], st = STATE[year];
  let c = 0, w = 0, marks = 0, max = 0;
  flat.forEach((q, i) => {
    max += q.m;
    const r = st.res[i];
    if (!r) return;
    if (r.ok) { c++; marks += q.m; } else w++;
  });
  $('attempted').textContent = c + w;
  $('total').textContent = flat.length;
  $('correct').textContent = c;
  $('wrong').textContent = w;
  $('marks').textContent = marks;
  $('maxmarks').textContent = max;
  $('bar').style.width = (flat.length ? (c + w) / flat.length * 100 : 0) + '%';
}

function refreshCard(i) {
  const old = document.querySelector(`.qcard[data-i="${i}"]`);
  const tmp = document.createElement('div');
  tmp.innerHTML = cardHTML(year, i);
  old.replaceWith(tmp.firstChild);
}

function evaluate(i, chosen) {
  const q = BANK[year][i];
  const ok = q.free || (chosen.length === q.a.length && q.a.every(x => chosen.includes(x)));
  STATE[year].res[i] = { chosen, ok };
  refreshCard(i);
  updateScore();
}

$('quiz').addEventListener('click', e => {
  const chk = e.target.closest('.check');
  if (chk) {
    const i = +chk.dataset.i;
    evaluate(i, STATE[year].draft[i] || []);
    return;
  }
  const btn = e.target.closest('.opt');
  if (!btn || btn.disabled) return;
  const i = +btn.dataset.i, o = +btn.dataset.o;
  const q = BANK[year][i];
  if (q.a.length > 1) {
    const d = STATE[year].draft[i] || [];
    const k = d.indexOf(o);
    if (k >= 0) d.splice(k, 1); else d.push(o);
    STATE[year].draft[i] = d;
    refreshCard(i);
  } else {
    evaluate(i, [o]);
  }
});

$('resetBtn').addEventListener('click', () => {
  STATE[year] = { res: {}, draft: {} };
  renderYear();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

function buildTabs() {
  $('tabs').innerHTML = Object.keys(YEARS).map(y =>
    `<button class="tab ${y === year ? 'active' : ''}" data-y="${y}">${y}</button>`).join('');
}
$('tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t) return;
  year = t.dataset.y;
  buildTabs();
  renderYear();
  window.scrollTo({ top: 0 });
});

buildTabs();
renderYear();
</script>
</body>
</html>
